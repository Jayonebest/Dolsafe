<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>TrustLens · Analytics</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Syne:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#02070F;--bg2:#060D1A;--bg3:#091628;--bg4:#0C1F3A;
  --border:#162E52;--border2:#1E3D6A;
  --blue:#3B9EFF;--blue2:#1A6FC4;--blue3:#0A2A5A;
  --green:#22C55E;--red:#EF4444;--yellow:#F59E0B;--orange:#F97316;
  --purple:#8B5CF6;--cyan:#06B6D4;
  --text:#F0F4FC;--muted:#B8C8E8;--dim:#8AA0C0;--dimmer:#3D5570;
  --mono:'JetBrains Mono',monospace;--sans:'Syne',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100%}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(ellipse 70% 40% at 50% -10%,rgba(59,158,255,.06),transparent),
  radial-gradient(ellipse 50% 30% at 90% 80%,rgba(139,92,246,.04),transparent)}

@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
@keyframes countUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes barGrow{from{height:0}to{height:var(--h)}}
@keyframes fillW{from{width:0}to{width:var(--w)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

/* ── TOPBAR ── */
.topbar{position:sticky;top:0;z-index:200;background:rgba(2,7,15,.97);
  backdrop-filter:blur(20px);border-bottom:1px solid var(--border);
  height:54px;display:flex;align-items:center;padding:0 24px;gap:14px}
.logo{font-size:16px;font-weight:900}.logo span{color:var(--blue)}
.tb-sep{width:1px;height:20px;background:var(--border)}
.tb-tag{font-size:9px;font-weight:700;color:var(--dim);font-family:var(--mono);letter-spacing:1.5px}
.tb-sp{flex:1}
.org-pill{display:flex;align-items:center;gap:8px;padding:5px 12px;
  border-radius:8px;background:var(--bg3);border:1px solid var(--border)}
.org-av{width:22px;height:22px;border-radius:6px;background:var(--blue2);
  display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:800;color:white}
.org-name{font-size:11px;font-weight:700;font-family:var(--mono)}
.org-sub{font-size:8px;color:var(--dim);font-family:var(--mono)}

/* ── PAGE HEADER ── */
.page-hdr{position:relative;z-index:1;padding:24px 24px 0}
.ph-row{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:18px}
.ph-tag{font-size:9px;font-weight:700;color:var(--blue);font-family:var(--mono);
  letter-spacing:2px;text-transform:uppercase;margin-bottom:7px;
  display:flex;align-items:center;gap:8px}
.ph-tag::before{content:'';display:block;width:18px;height:2px;background:var(--blue)}
.ph-title{font-size:26px;font-weight:900;letter-spacing:-.5px;margin-bottom:4px}
.ph-sub{font-size:13px;color:var(--muted);font-weight:500}
.ph-actions{display:flex;gap:8px;flex-shrink:0}

/* PERIOD + SITE TABS */
.controls{position:relative;z-index:1;padding:0 24px 18px;display:flex;gap:8px;flex-wrap:wrap}
.period-tabs{display:flex;background:var(--bg3);border:1px solid var(--border);border-radius:10px;overflow:hidden}
.pt{padding:7px 14px;font-size:11px;font-weight:700;font-family:var(--mono);
  cursor:pointer;color:var(--dim);transition:all .15s;border:none;background:transparent}
.pt.on{background:var(--blue3);color:var(--blue);border-radius:8px}
.site-tabs{display:flex;gap:6px}
.st{padding:7px 13px;border-radius:8px;font-size:11px;font-weight:700;
  font-family:var(--mono);cursor:pointer;color:var(--dim);
  border:1px solid var(--border);background:var(--bg3);transition:all .15s}
.st.on{border-color:var(--blue);background:var(--blue3);color:var(--blue)}
.live-chip{display:flex;align-items:center;gap:6px;padding:6px 12px;
  border-radius:8px;background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.2);
  font-size:10px;font-weight:700;color:var(--green);font-family:var(--mono);margin-left:auto}
.live-dot{width:7px;height:7px;border-radius:50%;background:var(--green);animation:pulse .9s infinite}

/* ── MAIN GRID ── */
.main{position:relative;z-index:1;padding:0 24px 32px;
  display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}

/* ── KPI STRIP ── */
.kpi-strip{grid-column:1/-1;display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.kpi{background:var(--bg2);border:1px solid var(--border);border-radius:12px;
  padding:13px 14px;animation:countUp .4s ease;transition:border-color .2s}
.kpi:hover{border-color:var(--border2)}
.kpi-val{font-size:22px;font-weight:900;font-family:var(--mono);margin-bottom:4px}
.kpi-lbl{font-size:8px;font-weight:700;color:var(--dim);text-transform:uppercase;
  letter-spacing:1px;font-family:var(--mono)}
.kpi-delta{font-size:10px;font-weight:700;margin-top:5px;font-family:var(--mono)}

/* ── CHART CARDS ── */
.chart-card{background:var(--bg2);border:1px solid var(--border);border-radius:14px;
  overflow:hidden;animation:fadeIn .4s ease}
.chart-card.span2{grid-column:span 2}
.chart-card.span3{grid-column:span 3}
.cc-hdr{padding:13px 16px;background:var(--bg3);border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:9px}
.cc-icon{font-size:14px;flex-shrink:0}
.cc-title{font-size:12px;font-weight:700;flex:1;font-family:var(--mono)}
.cc-badge{font-size:9px;font-weight:700;padding:2px 8px;border-radius:6px;font-family:var(--mono)}
.cc-body{padding:16px}
.chart-legend{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.cl-item{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--muted);font-family:var(--mono)}
.cl-dot{width:8px;height:8px;border-radius:2px;flex-shrink:0}

/* BAR CHART */
.bar-chart-wrap{display:flex;align-items:flex-end;gap:6px;height:140px;padding-bottom:20px;position:relative}
.bar-col{display:flex;flex-direction:column;align-items:center;gap:0;flex:1;height:100%}
.bar-stack{width:100%;display:flex;flex-direction:column;justify-content:flex-end;
  gap:1px;flex:1;cursor:pointer;transition:opacity .15s}
.bar-stack:hover{opacity:.8}
.bar-seg{border-radius:3px 3px 0 0;transition:height .6s ease;min-height:2px}
.bar-seg:not(:last-child){border-radius:0}
.bar-seg:last-child{border-radius:3px 3px 0 0}
.bar-lbl{font-size:9px;color:var(--dim);font-family:var(--mono);margin-top:5px;white-space:nowrap}
.bar-val{font-size:8px;color:var(--muted);font-family:var(--mono);font-weight:700}
.bar-axis{position:absolute;left:0;right:0;bottom:20px;border-top:1px solid var(--border)}

/* LINE CHART */
.line-chart-wrap{position:relative;height:140px}
.lc-canvas{width:100%;height:100%;display:block}
.lc-y-labels{position:absolute;left:0;top:0;bottom:0;display:flex;flex-direction:column;justify-content:space-between;font-size:8px;color:var(--dimmer);font-family:var(--mono);padding:4px 0}

/* HEAT MAP */
.heat-grid{display:grid;grid-template-columns:90px 1fr;gap:8px}
.heat-zones{display:flex;flex-direction:column;gap:4px}
.hz-row{display:flex;align-items:center;gap:6px}
.hz-label{font-size:10px;color:var(--muted);font-family:var(--mono);width:120px;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hz-bar-track{flex:1;height:18px;background:var(--border);border-radius:4px;overflow:hidden;position:relative}
.hz-bar-fill{height:100%;border-radius:4px;transition:width .8s ease;display:flex;align-items:center;justify-content:flex-end;padding-right:6px}
.hz-count{font-size:9px;font-weight:700;color:white;font-family:var(--mono)}
.heat-legend{display:flex;align-items:center;gap:6px;margin-top:10px;font-size:9px;color:var(--dim);font-family:var(--mono)}
.heat-scale{display:flex;gap:2px}
.hs-seg{width:16px;height:6px;border-radius:1px}

/* DONUT CHART */
.donut-wrap{display:flex;gap:16px;align-items:center}
.donut-canvas{flex-shrink:0}
.donut-legend{display:flex;flex-direction:column;gap:7px;flex:1}
.dl-item{display:flex;align-items:center;gap:7px;font-size:11px}
.dl-dot{width:10px;height:10px;border-radius:3px;flex-shrink:0}
.dl-label{color:var(--muted);font-family:var(--mono);flex:1}
.dl-pct{font-weight:700;font-family:var(--mono)}

/* THREAT CATEGORIES */
.threat-list{display:flex;flex-direction:column;gap:7px}
.tl-item{display:flex;align-items:center;gap:9px}
.tl-rank{font-size:11px;font-weight:700;color:var(--dimmer);font-family:var(--mono);width:16px;flex-shrink:0}
.tl-icon{font-size:15px;flex-shrink:0}
.tl-name{font-size:11px;font-weight:600;color:var(--text);flex:1;font-family:var(--mono)}
.tl-bar-track{width:80px;height:6px;background:var(--border);border-radius:3px;overflow:hidden;flex-shrink:0}
.tl-bar-fill{height:100%;border-radius:3px}
.tl-count{font-size:10px;font-weight:700;color:var(--muted);font-family:var(--mono);width:24px;text-align:right;flex-shrink:0}
.tl-delta{font-size:9px;font-weight:700;font-family:var(--mono);flex-shrink:0}

/* RESPONSE TIME */
.resp-wrap{display:flex;flex-direction:column;gap:8px}
.rt-item{display:flex;align-items:center;gap:9px}
.rt-label{font-size:10px;color:var(--muted);font-family:var(--mono);width:90px;flex-shrink:0}
.rt-bar-track{flex:1;height:22px;background:var(--bg3);border-radius:6px;overflow:hidden;position:relative}
.rt-bar-fill{height:100%;border-radius:6px;display:flex;align-items:center;padding-left:8px;transition:width .8s ease}
.rt-bar-val{font-size:10px;font-weight:700;color:white;font-family:var(--mono)}
.rt-sla{font-size:9px;font-weight:700;font-family:var(--mono);flex-shrink:0;width:40px;text-align:right}

/* WoW TABLE */
.wow-table{width:100%;border-collapse:collapse}
.wow-table th{padding:7px 10px;font-size:8px;font-weight:700;color:var(--dim);
  text-transform:uppercase;letter-spacing:1px;font-family:var(--mono);
  border-bottom:1px solid var(--border);text-align:left}
.wow-table td{padding:9px 10px;font-size:11px;font-family:var(--mono);
  border-bottom:1px solid rgba(22,46,82,.3)}
.wow-table tr:last-child td{border:none}
.wow-table tr:hover td{background:rgba(59,158,255,.03)}

/* BUTTONS */
.btn{padding:9px 16px;border-radius:9px;font-family:var(--sans);font-size:12px;
  font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:6px;
  transition:all .15s;border:none}
.btn-outline{background:var(--bg3);border:1px solid var(--border);color:var(--muted)}
.btn-outline:hover{border-color:var(--border2);color:var(--text)}
.btn-blue{background:linear-gradient(135deg,var(--blue),var(--blue2));color:white}

/* CHIP */
.chip{display:inline-flex;align-items:center;gap:3px;padding:2px 8px;
  border-radius:6px;font-size:9px;font-weight:700;font-family:var(--mono)}
.ch-red{background:rgba(239,68,68,.15);color:#FCA5A5;border:1px solid rgba(239,68,68,.3)}
.ch-green{background:rgba(34,197,94,.12);color:#86EFAC;border:1px solid rgba(34,197,94,.25)}
.ch-blue{background:rgba(59,158,255,.12);color:#93C5FD;border:1px solid rgba(59,158,255,.25)}
.ch-yellow{background:rgba(245,158,11,.12);color:#FCD34D;border:1px solid rgba(245,158,11,.25)}
.ch-purple{background:rgba(139,92,246,.12);color:#C4B5FD;border:1px solid rgba(139,92,246,.25)}
.ch-dim{background:rgba(100,120,160,.1);color:var(--dim);border:1px solid var(--border)}

/* TOAST */
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(10px);
  padding:10px 20px;border-radius:20px;font-size:12px;font-weight:700;opacity:0;
  transition:all .3s;pointer-events:none;z-index:999;font-family:var(--mono);
  background:var(--green);color:white}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

::-webkit-scrollbar{width:3px;height:3px}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}
</style>
</head>
<body>

<!-- TOPBAR -->
<div class="topbar">
  <div class="logo">Trust<span>Lens</span></div>
  <div class="tb-sep"></div>
  <div class="tb-tag">Analytics Dashboard</div>
  <div class="tb-sp"></div>
  <div class="org-pill">
    <div class="org-av">MTA</div>
    <div>
      <div class="org-name">MTA New York</div>
      <div class="org-sub">Analytics · Last 30 days</div>
    </div>
  </div>
</div>

<!-- PAGE HEADER -->
<div class="page-hdr">
  <div class="ph-row">
    <div>
      <div class="ph-tag">Intelligence Analytics</div>
      <div class="ph-title">Analytics Dashboard</div>
      <div class="ph-sub">MTA New York · Threat intelligence summary · All sites</div>
    </div>
    <div class="ph-actions">
      <button class="btn btn-outline" onclick="toast('CSV exported')">↓ Export CSV</button>
      <button class="btn btn-blue" onclick="toast('PDF report downloaded')">📄 PDF Report</button>
    </div>
  </div>
</div>

<!-- CONTROLS -->
<div class="controls">
  <div class="period-tabs">
    <div class="pt" onclick="setPeriod(7,this)">7d</div>
    <div class="pt on" onclick="setPeriod(30,this)">30d</div>
    <div class="pt" onclick="setPeriod(90,this)">90d</div>
  </div>
  <div class="site-tabs">
    <div class="st on" onclick="setSite('all',this)">All sites</div>
    <div class="st" onclick="setSite('ts',this)">Times Square</div>
    <div class="st" onclick="setSite('penn',this)">Penn Station</div>
    <div class="st" onclick="setSite('gc',this)">Grand Central</div>
  </div>
  <div class="live-chip"><div class="live-dot"></div>Live · Updated now</div>
</div>

<!-- MAIN GRID -->
<div class="main" id="mainGrid"></div>

<div class="toast" id="toastEl"></div>

<script>
// ══════════════════════════════════════════
// TRUSTLENS ANALYTICS DASHBOARD
// ══════════════════════════════════════════

var period = 30;
var site = 'all';

// ── DATA GENERATORS ──
function rnd(a,b){ return a + Math.floor(Math.random()*(b-a+1)); }
function rndF(a,b){ return +(a + Math.random()*(b-a)).toFixed(1); }

function getData(){
  var mult = site==='all'?1:site==='ts'?.45:site==='penn'?.35:.2;
  var pmult = period===7?.25:period===30?1:3.2;
  return {
    total:     Math.round(rnd(180,220)*mult*pmult),
    critical:  Math.round(rnd(12,18)*mult*pmult),
    autoDisp:  Math.round(rnd(28,38)*mult*pmult),
    fpRate:    rndF(6.2,9.8),
    avgConf:   rndF(87,94),
    avgResp:   rndF(2.8,4.2),
    // Weekly bars (last 8 weeks or days)
    bars: Array.from({length:period===7?7:period===30?8:12}, function(_,i){
      return {
        critical: Math.round(rnd(2,8)*mult),
        high:     Math.round(rnd(5,14)*mult),
        elevated: Math.round(rnd(8,20)*mult),
        watch:    Math.round(rnd(10,28)*mult),
      };
    }),
    // FP rate trend
    fpTrend: Array.from({length:period===7?7:period===30?30:90}, function(){
      return rndF(4,14);
    }),
    // Zone heatmap
    zones: [
      {name:'Platform B · Downtown', count:Math.round(rnd(32,48)*mult*pmult), pct:.92},
      {name:'Platform A · Uptown',   count:Math.round(rnd(24,38)*mult*pmult), pct:.75},
      {name:'Mezzanine · Fare gates',count:Math.round(rnd(18,28)*mult*pmult), pct:.58},
      {name:'Main Concourse',        count:Math.round(rnd(14,24)*mult*pmult), pct:.46},
      {name:'Street Entrance N',     count:Math.round(rnd(8,18)*mult*pmult),  pct:.32},
      {name:'Track Level · Gates',   count:Math.round(rnd(6,14)*mult*pmult),  pct:.22},
      {name:'Baggage & Ticketing',   count:Math.round(rnd(4,10)*mult*pmult),  pct:.16},
    ],
    // Device types
    devices: [
      {label:'Phone (PH)',    pct:52, color:'#3B9EFF'},
      {label:'Unknown (UK)',  pct:24, color:'#F59E0B'},
      {label:'Tactical (TR)', pct:14, color:'#8B5CF6'},
      {label:'Drone (DR)',    pct:6,  color:'#EF4444'},
      {label:'Other (EB)',    pct:4,  color:'#64748B'},
    ],
    // Threat categories
    threats: [
      {icon:'📦',name:'Unattended pkg',    count:Math.round(rnd(28,42)*mult*pmult), pct:.88, color:'#F59E0B', delta:'+12%'},
      {icon:'👁️',name:'Suspicious activity',count:Math.round(rnd(22,34)*mult*pmult), pct:.72, color:'#8B5CF6', delta:'+8%'},
      {icon:'🥊',name:'Fight / altercation',count:Math.round(rnd(14,22)*mult*pmult), pct:.52, color:'#EF4444', delta:'-3%'},
      {icon:'🚫',name:'Trespass',           count:Math.round(rnd(10,18)*mult*pmult), pct:.40, color:'#F97316', delta:'+18%'},
      {icon:'🔫',name:'Weapon detected',    count:Math.round(rnd(4,10)*mult*pmult),  pct:.22, color:'#DC2626', delta:'+2%'},
      {icon:'😵',name:'Medical emergency',  count:Math.round(rnd(6,12)*mult*pmult),  pct:.28, color:'#06B6D4', delta:'-5%'},
    ],
    // Response times by site
    respTimes: [
      {label:'Times Sq · Crit',  val:2.8, sla:'✓ SLA', slaColor:'var(--green)'},
      {label:'Times Sq · High',  val:4.2, sla:'✓ SLA', slaColor:'var(--green)'},
      {label:'Penn Stn · Crit',  val:3.1, sla:'✓ SLA', slaColor:'var(--green)'},
      {label:'Penn Stn · High',  val:5.8, sla:'⚠ SLA', slaColor:'var(--yellow)'},
      {label:'Grand Cen · Crit', val:3.6, sla:'✓ SLA', slaColor:'var(--green)'},
      {label:'Grand Cen · High', val:6.2, sla:'⚠ SLA', slaColor:'var(--yellow)'},
    ],
    // Week-over-week
    wow: [
      {metric:'Total incidents',   cur:0, prev:0, unit:''},
      {metric:'Critical alerts',   cur:0, prev:0, unit:''},
      {metric:'Auto-dispatched',   cur:0, prev:0, unit:''},
      {metric:'False positive rate',cur:0,prev:0, unit:'%'},
      {metric:'Avg response time', cur:0, prev:0, unit:'m'},
      {metric:'Avg confidence',    cur:0, prev:0, unit:'%'},
    ],
  };
}

// ── KPI STRIP ──
function renderKPIs(d){
  var kpis = [
    {val:d.total,    lbl:'Total incidents',   color:'var(--blue)',  delta:'+12% vs prev'},
    {val:d.critical, lbl:'Critical alerts',   color:'var(--red)',   delta:d.critical>15?'⚠ Review':'✓ Normal'},
    {val:d.autoDisp, lbl:'Auto-dispatched',   color:'var(--purple)',delta:Math.round(d.autoDisp/d.total*100)+'% auto rate'},
    {val:d.fpRate+'%',lbl:'False positive',   color:'var(--yellow)',delta:d.fpRate<10?'✓ Within SLA':'⚠ Above 10%'},
    {val:d.avgConf+'%',lbl:'Avg confidence', color:'var(--green)', delta:'DolSafe accuracy'},
    {val:d.avgResp+'m',lbl:'Avg response',   color:'var(--cyan)',  delta:'Critical incidents'},
  ];
  return '<div class="kpi-strip">'+kpis.map(function(k){
    return '<div class="kpi">'+
      '<div class="kpi-val" style="color:'+k.color+'">'+k.val+'</div>'+
      '<div class="kpi-lbl">'+k.lbl+'</div>'+
      '<div class="kpi-delta" style="color:'+k.color+';opacity:.7">'+k.delta+'</div>'+
    '</div>';
  }).join('')+'</div>';
}

// ── BAR CHART ──
function renderBarChart(d){
  var labels = period===7
    ? ['Mon','Tue','Wed','Thu','Fri','Sat','Sun']
    : period===30
    ? ['W1','W2','W3','W4','W5','W6','W7','W8']
    : ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

  var maxVal = Math.max.apply(null, d.bars.map(function(b){return b.critical+b.high+b.elevated+b.watch;}));

  var html =
    '<div class="chart-card span2">'+
      '<div class="cc-hdr">'+
        '<div class="cc-icon">📊</div>'+
        '<div class="cc-title">Alerts by severity — '+(period===7?'daily':period===30?'weekly':'monthly')+'</div>'+
        '<div class="cc-badge chip ch-blue">'+d.total+' total</div>'+
      '</div>'+
      '<div class="cc-body">'+
        '<div class="chart-legend">'+
          [{c:'var(--red)',l:'Critical'},{c:'var(--orange)',l:'High'},{c:'var(--yellow)',l:'Elevated'},{c:'var(--dim)',l:'Watch'}].map(function(x){
            return '<div class="cl-item"><div class="cl-dot" style="background:'+x.c+'"></div>'+x.l+'</div>';
          }).join('')+
        '</div>'+
        '<div class="bar-chart-wrap" id="barWrap">'+
          '<div class="bar-axis"></div>'+
          d.bars.map(function(b,i){
            var total=b.critical+b.high+b.elevated+b.watch;
            var pct=total/maxVal;
            return '<div class="bar-col">'+
              '<div class="bar-val">'+total+'</div>'+
              '<div class="bar-stack" style="height:'+(pct*100)+'%" onclick="">'+
                ['critical','high','elevated','watch'].map(function(sev){
                  var color=sev==='critical'?'var(--red)':sev==='high'?'var(--orange)':sev==='elevated'?'var(--yellow)':'var(--dimmer)';
                  var h=Math.round(b[sev]/total*100);
                  return '<div class="bar-seg" style="height:'+h+'%;background:'+color+';min-height:'+(b[sev]>0?'3':'0')+'px"></div>';
                }).join('')+
              '</div>'+
              '<div class="bar-lbl">'+(labels[i]||'')+'</div>'+
            '</div>';
          }).join('')+
        '</div>'+
      '</div>'+
    '</div>';
  return html;
}

// ── LINE CHART (FP Rate) ──
function renderLineChart(d){

    '<div class="cc-hdr">'+
      '<div class="cc-icon">📈</div>'+
      '<div class="cc-title">False positive rate trend</div>'+
      '<div class="cc-badge chip '+(d.fpRate<10?'ch-green':'ch-yellow')+'">'+d.fpRate+'% current</div>'+
    '</div>'+
    '<div class="cc-body">'+
      '<div class="chart-legend">'+
        '<div class="cl-item"><div class="cl-dot" style="background:var(--blue)"></div>FP rate %</div>'+
        '<div class="cl-item"><div class="cl-dot" style="background:var(--red);border-radius:50%"></div>10% SLA ceiling</div>'+
      '</div>'+
      '<div class="line-chart-wrap">'+
        '<canvas id="lineChart"></canvas>'+
      '</div>'+
      '<div style="font-size:10px;color:var(--dim);font-family:var(--mono);margin-top:8px">'+
        'SLA target: &lt;10% · Current: '+d.fpRate+'% · '+(d.fpRate<10?'✓ Within SLA':'⚠ Above target')+

// ── ZONE HEAT MAP ──
function renderHeatMap(d){
  var maxCount = d.zones[0].count;
  return '<div class="chart-card span2">'+
    '<div class="cc-hdr">'+
      '<div class="cc-icon">🗺️</div>'+
      '<div class="cc-title">Zone incident heat map — highest activity</div>'+
      '<div class="cc-badge chip ch-red">'+d.zones[0].name.split('·')[0].trim()+' hotspot</div>'+
    '</div>'+
    '<div class="cc-body">'+
      '<div class="heat-zones">'+
      d.zones.map(function(z){
        var intensity = z.count/maxCount;
        var color = intensity>.8?'var(--red)':intensity>.6?'var(--orange)':intensity>.4?'var(--yellow)':intensity>.25?'var(--blue)':'var(--dim)';
        return '<div class="hz-row">'+
          '<div class="hz-label">'+z.name+'</div>'+
          '<div class="hz-bar-track">'+
            '<div class="hz-bar-fill" style="width:'+(z.pct*100)+'%;background:'+color+'">'+
              '<div class="hz-count">'+z.count+'</div>'+
            '</div>'+
          '</div>'+
        '</div>';
      }).join('')+
      '</div>'+
      '<div class="heat-legend">'+
        '<div>Intensity:</div>'+
        '<div class="heat-scale">'+
          ['var(--dim)','var(--blue)','var(--yellow)','var(--orange)','var(--red)'].map(function(c){
            return '<div class="hs-seg" style="background:'+c+'"></div>';
          }).join('')+
        '</div>'+
        '<div>Low → Critical</div>'+
      '</div>'+
    '</div>'+
  '</div>';
}

// ── DONUT — DEVICE TYPES ──
function renderDonut(d){
  return '<div class="chart-card">'+
    '<div class="cc-hdr">'+
      '<div class="cc-icon">📡</div>'+
      '<div class="cc-title">Device type breakdown</div>'+
      '<div class="cc-badge chip ch-dim">RF intelligence</div>'+
    '</div>'+
    '<div class="cc-body">'+
      '<div class="donut-wrap">'+
        '<canvas id="donutChart" width="110" height="110" class="donut-canvas"></canvas>'+
        '<div class="donut-legend">'+
          d.devices.map(function(dv){
            return '<div class="dl-item">'+
              '<div class="dl-dot" style="background:'+dv.color+'"></div>'+
              '<div class="dl-label">'+dv.label+'</div>'+
              '<div class="dl-pct" style="color:'+dv.color+'">'+dv.pct+'%</div>'+
            '</div>';
          }).join('')+
        '</div>'+
      '</div>'+
    '</div>'+
  '</div>';
}

// ── THREAT CATEGORIES ──
function renderThreats(d){
  return '<div class="chart-card">'+
    '<div class="cc-hdr">'+
      '<div class="cc-icon">🎯</div>'+
      '<div class="cc-title">Top threat categories</div>'+
      '<div class="cc-badge chip ch-purple">'+period+'d period</div>'+
    '</div>'+
    '<div class="cc-body">'+
      '<div class="threat-list">'+
      d.threats.map(function(t,i){
        var positive = t.delta.startsWith('+');

          '<div class="tl-rank">#'+(i+1)+'</div>'+
          '<div class="tl-icon">'+t.icon+'</div>'+
          '<div class="tl-name">'+t.name+'</div>'+
          '<div class="tl-bar-track"><div class="tl-bar-fill" style="width:'+(t.pct*100)+'%;background:'+t.color+'"></div></div>'+
          '<div class="tl-count" style="color:'+t.color+'">'+t.count+'</div>'+
          '<div class="tl-delta" style="color:'+(positive?'var(--red)':'var(--green)')+'">'+t.delta+'</div>'+
        '</div>';

// ── RESPONSE TIMES ──
function renderResponseTimes(d){
  var maxVal = Math.max.apply(null, d.respTimes.map(function(r){return r.val;}));
  return '<div class="chart-card">'+
    '<div class="cc-hdr">'+
      '<div class="cc-icon">⚡</div>'+
      '<div class="cc-title">Avg response time by site &amp; severity</div>'+
      '<div class="cc-badge chip ch-green">SLA: &lt;5m critical</div>'+
    '</div>'+
    '<div class="cc-body">'+
      '<div class="resp-wrap">'+
      d.respTimes.map(function(r){
        var pct = r.val/maxVal;
        var color = r.val<4?'var(--green)':r.val<6?'var(--yellow)':'var(--red)';
        return '<div class="rt-item">'+
          '<div class="rt-label">'+r.label+'</div>'+
          '<div class="rt-bar-track">'+
            '<div class="rt-bar-fill" style="width:'+(pct*85+15)+'%;background:'+color+'">'+
              '<div class="rt-bar-val">'+r.val+'m</div>'+
            '</div>'+
          '</div>'+
          '<div class="rt-sla" style="color:'+r.slaColor+'">'+r.sla+'</div>'+
        '</div>';
      }).join('')+
      '</div>'+
    '</div>'+
  '</div>';
}

// ── WoW TABLE ──
function renderWoW(d){
  var rows=[
    ['Total incidents',d.total,Math.round(d.total*.88),''],
    ['Critical alerts',d.critical,Math.round(d.critical*1.12),''],
    ['Auto-dispatched',d.autoDisp,Math.round(d.autoDisp*.95),''],
    ['False positive %',d.fpRate,rndF(6,11),'%'],
    ['Avg response',d.avgResp,rndF(3,5),'m'],
    ['Avg confidence',d.avgConf,rndF(85,93),'%'],
  ];
  return '<div class="chart-card span3">'+
    '<div class="cc-hdr">'+
      '<div class="cc-icon">📋</div>'+
      '<div class="cc-title">Week-over-week comparison — all key metrics</div>'+
      '<div class="cc-badge chip ch-blue">vs previous period</div>'+
    '</div>'+
    '<div class="cc-body">'+
      '<table class="wow-table">'+
        '<thead><tr>'+
          '<th>Metric</th><th>This period</th><th>Previous period</th><th>Change</th><th>Trend</th><th>Status</th>'+
        '</tr></thead>'+
        '<tbody>'+
        rows.map(function(r){
          var cur=r[1], prev=r[2], unit=r[3];
          var diff=((cur-prev)/prev*100).toFixed(1);
          var up=cur>prev;
          var metric=r[0];
          // For FP rate and response time, up is bad
          var isBadIfUp = metric.includes('positive')||metric.includes('response');
          var good = isBadIfUp ? !up : up;
          var trendIcons=['📈','📉'];
          return '<tr>'+
            '<td style="font-weight:600;color:var(--text)">'+metric+'</td>'+
            '<td style="color:var(--blue);font-weight:700">'+cur+unit+'</td>'+
            '<td style="color:var(--dim)">'+prev+unit+'</td>'+
            '<td style="color:'+(good?'var(--green)':'var(--red)')+'"><b>'+(up?'+':'')+diff+'%</b></td>'+
            '<td>'+(up?trendIcons[0]:trendIcons[1])+'</td>'+
            '<td><span class="chip '+(good?'ch-green':'ch-red')+'">'+(good?'✓ Good':'⚠ Watch')+'</span></td>'+
          '</tr>';
        }).join('')+
        '</tbody>'+
      '</table>'+
    '</div>'+
  '</div>';
}

// ── CANVAS CHARTS ──
function drawLineChart(trend, fpRate){
  var c = document.getElementById('lineChart'); if(!c) return;
  var wrap = c.parentElement;
  c.width = wrap.offsetWidth || 280; c.height = 140;
  var ctx = c.getContext('2d'), W = c.width, H = c.height;
  var pts = trend.length;
  var minV = 0, maxV = 16;

  // Grid
  ctx.strokeStyle = 'rgba(22,46,82,.6)'; ctx.lineWidth = .5;
  [4,8,12].forEach(function(v){
    var y = H - (v/maxV)*H*.85 - H*.05;
    ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke();
    ctx.fillStyle = 'var(--dimmer)'; ctx.font = '8px monospace';
    ctx.fillText(v+'%', 2, y-2);
  });

  // SLA line
  ctx.strokeStyle = 'rgba(239,68,68,.35)'; ctx.lineWidth = 1.5;
  ctx.setLineDash([5,4]);
  var slaY = H - (10/maxV)*H*.85 - H*.05;
  ctx.beginPath(); ctx.moveTo(0,slaY); ctx.lineTo(W,slaY); ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = 'rgba(239,68,68,.7)'; ctx.font = '8px monospace';
  ctx.fillText('10% SLA', W-52, slaY-3);

  // Area fill
  ctx.beginPath();
  trend.forEach(function(v,i){
    var x = i/(pts-1)*W;
    var y = H - (v/maxV)*H*.85 - H*.05;
    i===0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
  });
  ctx.lineTo(W,H); ctx.lineTo(0,H); ctx.closePath();
  ctx.fillStyle = 'rgba(59,158,255,.08)'; ctx.fill();

  // Line
  ctx.beginPath();
  trend.forEach(function(v,i){
    var x = i/(pts-1)*W;
    var y = H - (v/maxV)*H*.85 - H*.05;
    i===0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
  });
  ctx.strokeStyle = '#3B9EFF'; ctx.lineWidth = 2; ctx.stroke();

  // Current dot
  var lastX = W, lastY = H - (trend[pts-1]/maxV)*H*.85 - H*.05;
  ctx.beginPath(); ctx.arc(lastX, lastY, 4, 0, Math.PI*2);
  ctx.fillStyle = '#3B9EFF'; ctx.fill();
  ctx.strokeStyle = 'var(--bg2)'; ctx.lineWidth = 2; ctx.stroke();
}

function drawDonut(devices){
  var c = document.getElementById('donutChart'); if(!c) return;
  var ctx = c.getContext('2d'), W=110, H=110;
  var cx=W/2, cy=H/2, r=42, ir=26;
  var start = -Math.PI/2;

  devices.forEach(function(d){
    var angle = (d.pct/100)*Math.PI*2;
    ctx.beginPath();
    ctx.moveTo(cx,cy);
    ctx.arc(cx,cy,r,start,start+angle);
    ctx.closePath();
    ctx.fillStyle = d.color;
    ctx.fill();
    start += angle;
  });

  // Hole
  ctx.beginPath(); ctx.arc(cx,cy,ir,0,Math.PI*2);
  ctx.fillStyle = 'var(--bg2)'; ctx.fill();

  // Center label
  ctx.fillStyle = 'var(--text)'; ctx.font = 'bold 11px monospace';
  ctx.textAlign = 'center';
  ctx.fillText(devices[0].pct+'%', cx, cy-2);
  ctx.fillStyle = 'var(--dim)'; ctx.font = '7px monospace';
  ctx.fillText('PH', cx, cy+9);
  ctx.textAlign = 'left';
}

// ── FULL RENDER ──
function renderAll(){
  var d = getData();
  var grid = document.getElementById('mainGrid');
  grid.innerHTML =
    renderKPIs(d) +
    renderBarChart(d) +
    renderLineChart(d) +
    renderHeatMap(d) +
    renderDonut(d) +
    renderThreats(d) +
    renderResponseTimes(d) +
    renderWoW(d);

  // Draw canvas charts after DOM
  setTimeout(function(){
    drawLineChart(d.fpTrend, d.fpRate);
    drawDonut(d.devices);
  }, 50);
}

// ── CONTROLS ──
function setPeriod(p, el){
  period = p;
  document.querySelectorAll('.pt').forEach(function(e){e.classList.remove('on');});
  el.classList.add('on');
  renderAll();
}
function setSite(s, el){
  site = s;
  document.querySelectorAll('.st').forEach(function(e){e.classList.remove('on');});
  el.classList.add('on');
  renderAll();
}

function toast(msg){
  var t = document.getElementById('toastEl');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._t); t._t = setTimeout(function(){t.classList.remove('show');}, 3000);
}

window.addEventListener('load', renderAll);
window.addEventListener('resize', function(){
  drawLineChart(getData().fpTrend);
  drawDonut(getData().devices);
});
</script>
