<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0">
<title>DolSafe · SmartReport</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#E8ECF2;font-family:'Inter',sans-serif;color:#111827}
.phone{width:100%;max-width:390px;min-height:100vh;background:#F2F5FA;
  display:flex;flex-direction:column;margin:0 auto;box-shadow:0 0 40px rgba(0,0,0,.12)}

/* STATUS */
.status{height:44px;background:#1A56DB;display:flex;align-items:center;
  justify-content:space-between;padding:0 20px;flex-shrink:0}
.st-time{font-size:15px;font-weight:700;color:white}
.st-r{font-size:11px;color:rgba(255,255,255,.85)}

/* HEADER */
.hdr{background:#1A56DB;padding:10px 16px 0}
.hdr-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.back-btn{width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,.18);
  border:none;color:white;font-size:20px;cursor:pointer;display:flex;
  align-items:center;justify-content:center;flex-shrink:0;font-weight:700}
.hdr-c{flex:1}
.hdr-title{font-size:17px;font-weight:800;color:white;letter-spacing:-.3px}
.hdr-sub{font-size:11px;color:rgba(255,255,255,.68);font-weight:500;margin-top:1px}
.anon-chip{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.28);
  border-radius:20px;padding:5px 10px;font-size:10px;font-weight:700;color:white;
  display:flex;align-items:center;gap:4px;flex-shrink:0}

/* PROGRESS */
.prog-wrap{background:#1A56DB;padding:0 16px 14px}
.prog-bars{display:flex;gap:5px;margin-bottom:6px}
.pb{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.2);transition:background .35s}
.pb.done{background:white}
.pb.active{background:rgba(255,255,255,.6)}
.prog-row{display:flex;justify-content:space-between}
.prog-lbl{font-size:10px;font-weight:700;color:rgba(255,255,255,.75)}
.prog-ct{font-size:10px;color:rgba(255,255,255,.5)}

/* SCROLL */
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;padding-bottom:90px}
.scroll::-webkit-scrollbar{display:none}

@keyframes stepIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes recblink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes waveform{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes typewriter{from{width:0}to{width:100%}}

.step-body{padding:16px;animation:stepIn .28s ease}
.step-h{font-size:20px;font-weight:900;color:#111827;letter-spacing:-.4px;margin-bottom:5px}
.step-d{font-size:13px;color:#6B7280;font-weight:500;line-height:1.6;margin-bottom:18px}

/* ── CAPTURE SCREEN ── */
.capture-zone{margin-bottom:14px}
.viewfinder{background:#111827;border-radius:16px;overflow:hidden;position:relative;
  height:260px;cursor:pointer}
.vf-canvas{width:100%;height:100%;display:block}
.vf-overlay{position:absolute;inset:0;display:flex;flex-direction:column;pointer-events:none}
.vf-top{padding:12px 14px;display:flex;align-items:center;justify-content:space-between}
.vf-rec-badge{display:flex;align-items:center;gap:5px;background:rgba(0,0,0,.55);
  padding:4px 10px;border-radius:8px;font-size:10px;font-weight:700;color:white}
.vf-recdot{width:7px;height:7px;border-radius:50%;background:#EF4444;animation:recblink 1s infinite}
.vf-timer{background:rgba(0,0,0,.55);padding:4px 10px;border-radius:8px;
  font-size:11px;font-weight:700;color:white}
.vf-focus{position:absolute;top:50%;left:50%;transform:translate(-50%,-60%);
  width:90px;height:90px;border:1.5px solid rgba(255,255,255,.6);border-radius:4px;
  pointer-events:none}
.vf-corner{position:absolute;width:12px;height:12px;border:2.5px solid white}
.vf-corner.tl{top:-1px;left:-1px;border-right:none;border-bottom:none;border-radius:3px 0 0 0}
.vf-corner.tr{top:-1px;right:-1px;border-left:none;border-bottom:none;border-radius:0 3px 0 0}
.vf-corner.bl{bottom:-1px;left:-1px;border-right:none;border-top:none;border-radius:0 0 0 3px}
.vf-corner.br{bottom:-1px;right:-1px;border-left:none;border-top:none;border-radius:0 0 3px 0}
.vf-bottom{position:absolute;bottom:0;left:0;right:0;padding:10px 14px;
  background:linear-gradient(transparent,rgba(0,0,0,.6))}
.vf-hint{font-size:10px;color:rgba(255,255,255,.8);text-align:center;font-weight:500}
.vf-idle{position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;cursor:pointer}
.vf-idle-icon{font-size:44px;margin-bottom:10px;opacity:.6}
.vf-idle-text{font-size:14px;color:rgba(255,255,255,.7);font-weight:600}
.vf-idle-sub{font-size:11px;color:rgba(255,255,255,.45);margin-top:4px}

/* MEDIA CONTROLS */
.media-controls{display:flex;gap:8px;margin-top:8px}
.mc-btn{flex:1;padding:12px 8px;border-radius:12px;border:none;font-family:'Inter',sans-serif;
  font-size:13px;font-weight:700;cursor:pointer;display:flex;align-items:center;
  justify-content:center;gap:7px;transition:all .15s}
.mc-btn:active{transform:scale(.97)}
.mc-video{background:#1A56DB;color:white}
.mc-photo{background:white;color:#374151;border:1.5px solid #E5E7EB}
.mc-stop{background:#EF4444;color:white}
.mc-stop.recording{animation:pulse .9s infinite}

/* CAPTURED MEDIA ROW */
.media-row{display:flex;gap:7px;overflow-x:auto;padding:2px;margin-bottom:12px}
.media-row::-webkit-scrollbar{display:none}
.media-thumb{width:68px;height:68px;border-radius:10px;flex-shrink:0;
  background:#E5E7EB;position:relative;overflow:hidden;cursor:pointer;
  border:2px solid #E5E7EB;transition:border-color .15s}
.media-thumb.sel{border-color:#1A56DB}
.mt-preview{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:26px}
.mt-type{position:absolute;bottom:3px;left:3px;background:rgba(0,0,0,.65);
  border-radius:4px;padding:1px 5px;font-size:8px;font-weight:700;color:white}
.mt-dur{position:absolute;bottom:3px;right:3px;background:rgba(0,0,0,.65);
  border-radius:4px;padding:1px 5px;font-size:8px;font-weight:700;color:white}
.mt-remove{position:absolute;top:3px;right:3px;width:16px;height:16px;border-radius:50%;
  background:#EF4444;color:white;font-size:9px;font-weight:900;
  display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:2}
.add-more-btn{width:68px;height:68px;border-radius:10px;flex-shrink:0;
  background:white;border:2px dashed #D1D5DB;display:flex;flex-direction:column;
  align-items:center;justify-content:center;cursor:pointer;gap:2px}
.amb-icon{font-size:20px}
.amb-label{font-size:9px;font-weight:600;color:#9CA3AF}

/* WAVEFORM */
.waveform{display:flex;align-items:center;gap:2px;height:24px;padding:0 2px}
.wf{width:3px;border-radius:2px;background:#EF4444;transform-origin:bottom}
.wf:nth-child(odd){animation:waveform .45s ease-in-out infinite}
.wf:nth-child(even){animation:waveform .45s ease-in-out infinite .15s}
.wf.h{height:20px}.wf.m{height:13px}.wf.s{height:7px}

/* AI REPORT SECTION */
.ai-generating{background:white;border:1px solid #BFDBFE;border-radius:16px;
  padding:16px;margin-bottom:12px}
.ai-header{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.ai-dot{width:10px;height:10px;border-radius:50%;background:#1A56DB;animation:pulse .8s infinite;flex-shrink:0}
.ai-spinner{width:20px;height:20px;border:2.5px solid #BFDBFE;border-top-color:#1A56DB;
  border-radius:50%;animation:spin .7s linear infinite;flex-shrink:0}
.ai-title{font-size:14px;font-weight:700;color:#1E40AF;flex:1}
.ai-badge{font-size:10px;font-weight:700;padding:3px 8px;border-radius:8px;
  background:#DBEAFE;color:#1E40AF;flex-shrink:0}
.ai-skeleton{background:linear-gradient(90deg,#EFF6FF 25%,#DBEAFE 50%,#EFF6FF 75%);
  background-size:200% 100%;animation:shimmer 1.4s infinite;border-radius:6px;height:13px;margin-bottom:8px}
.ai-skeleton.w-full{width:100%}.ai-skeleton.w-3q{width:75%}.ai-skeleton.w-half{width:52%}

/* GENERATED REPORT FIELDS */
.report-field{background:white;border:1.5px solid #E5E7EB;border-radius:12px;
  overflow:hidden;margin-bottom:10px}
.rf-header{padding:10px 13px;background:#F9FAFB;border-bottom:1px solid #E5E7EB;
  display:flex;align-items:center;gap:8px}
.rf-icon{font-size:15px;flex-shrink:0}
.rf-label{font-size:11px;font-weight:700;color:#374151;flex:1}
.rf-ai-badge{font-size:9px;font-weight:700;padding:2px 7px;border-radius:6px;
  background:#EFF6FF;color:#1E40AF;display:flex;align-items:center;gap:4px}
.rf-ai-dot{width:6px;height:6px;border-radius:50%;background:#1A56DB}
.rf-body{padding:11px 13px}
.rf-text{font-size:13px;color:#111827;font-weight:500;line-height:1.65}
.rf-edit-btn{display:flex;align-items:center;gap:5px;margin-top:8px;
  font-size:11px;font-weight:700;color:#1A56DB;cursor:pointer;
  padding:5px 10px;border-radius:8px;background:#EFF6FF;border:none;
  font-family:'Inter',sans-serif;width:fit-content}
.rf-edit-btn:active{opacity:.7}

/* EDIT MODE */
.rf-textarea{width:100%;border:none;outline:none;font-family:'Inter',sans-serif;
  font-size:13px;color:#111827;line-height:1.65;resize:none;background:transparent;
  min-height:80px}
.rf-edit-actions{display:flex;gap:7px;margin-top:9px;padding-top:9px;
  border-top:1px solid #F3F4F6}
.rf-save-btn{padding:7px 14px;border-radius:8px;background:#1A56DB;border:none;
  font-family:'Inter',sans-serif;font-size:12px;font-weight:700;color:white;cursor:pointer}
.rf-cancel-btn{padding:7px 12px;border-radius:8px;background:#F9FAFB;border:1px solid #E5E7EB;
  font-family:'Inter',sans-serif;font-size:12px;font-weight:600;color:#374151;cursor:pointer}
.rf-edited-badge{font-size:9px;font-weight:700;padding:2px 7px;border-radius:6px;
  background:#FEF3C7;color:#92400E;display:flex;align-items:center;gap:4px}

/* CONFIDENCE METER */
.confidence-bar{margin-bottom:14px}
.cb-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px}
.cb-label{font-size:12px;font-weight:700;color:#374151}
.cb-pct{font-size:13px;font-weight:800;color:#1A56DB;font-family:'Inter',sans-serif}
.cb-track{height:7px;background:#E5E7EB;border-radius:4px;overflow:hidden}
.cb-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,#3B82F6,#1A56DB);
  transition:width 1.2s ease}

/* COMMENT BOX */
.comment-card{background:white;border:1.5px solid #E5E7EB;border-radius:12px;
  padding:12px 13px;margin-bottom:12px}
.comment-lbl{font-size:12px;font-weight:700;color:#374151;margin-bottom:6px;
  display:flex;align-items:center;gap:6px}
.comment-ta{width:100%;border:2px solid #E5E7EB;border-radius:10px;
  padding:10px 12px;font-family:'Inter',sans-serif;font-size:13px;
  color:#111827;resize:none;min-height:72px;outline:none;
  line-height:1.55;background:#F9FAFB;transition:border-color .2s}
.comment-ta:focus{border-color:#1A56DB;background:white}
.comment-ta::placeholder{color:#9CA3AF}
.char-ct{font-size:11px;color:#9CA3AF;text-align:right;margin-top:3px}

/* SEVERITY CHIPS */
.sev-row{display:flex;gap:7px;margin-bottom:14px}
.sev-chip{flex:1;padding:9px 6px;border-radius:10px;border:2px solid #E5E7EB;
  background:white;cursor:pointer;text-align:center;transition:all .15s;font-family:'Inter',sans-serif}
.sev-chip:active{transform:scale(.97)}
.sev-chip.sl{border-color:#10B981;background:#F0FDF4}
.sev-chip.sm{border-color:#F59E0B;background:#FFFBEB}
.sev-chip.sh{border-color:#EF4444;background:#FEF2F2}
.sc-icon{font-size:18px;display:block;margin-bottom:3px}
.sc-label{font-size:11px;font-weight:700;color:#374151}

/* ANON + TL CARDS */
.anon-box{background:#F0FDF4;border:1px solid #BBF7D0;border-radius:12px;
  padding:11px 13px;margin-bottom:12px}
.anon-title{font-size:12px;font-weight:700;color:#065F46;margin-bottom:6px;
  display:flex;align-items:center;gap:5px}
.anon-row{display:flex;gap:7px;font-size:11px;color:#047857;font-weight:500;
  line-height:1.45;margin-bottom:4px}
.anon-row:last-child{margin:0}
.tl-card{background:#EFF6FF;border:1px solid #BFDBFE;border-radius:12px;
  padding:11px 13px;margin-bottom:12px;display:flex;gap:9px}
.tl-icon{font-size:18px;flex-shrink:0;margin-top:1px}
.tl-title{font-size:12px;font-weight:700;color:#1E40AF;margin-bottom:3px}
.tl-desc{font-size:11px;color:#3B82F6;font-weight:500;line-height:1.5}

/* REVIEW */
.review-box{background:white;border:1px solid #E5E7EB;border-radius:14px;overflow:hidden;margin-bottom:12px}
.rv{display:flex;gap:10px;padding:10px 13px;border-bottom:1px solid #F3F4F6;align-items:flex-start}
.rv:last-child{border:none}
.rv-icon{font-size:15px;flex-shrink:0;margin-top:1px}
.rv-lbl{font-size:10px;color:#9CA3AF;font-weight:600;letter-spacing:.3px;margin-bottom:2px}
.rv-val{font-size:13px;font-weight:600;color:#111827;line-height:1.4}

/* SUCCESS */
.success{padding:20px 16px;text-align:center;animation:stepIn .4s ease}
.suc-icon{font-size:54px;margin-bottom:14px}
.suc-title{font-size:22px;font-weight:900;color:#065F46;letter-spacing:-.4px;margin-bottom:6px}
.suc-sub{font-size:13px;color:#374151;font-weight:500;line-height:1.65;margin-bottom:16px}
.report-id-box{background:#F9FAFB;border:1px solid #E5E7EB;border-radius:10px;
  padding:10px 14px;font-size:11px;color:#6B7280;margin-bottom:12px;text-align:center;font-weight:500}
.report-id-box span{font-weight:800;color:#111827;font-size:13px;font-family:'Inter',monospace}
.tl-live{background:#EFF6FF;border:1px solid #BFDBFE;border-radius:12px;
  padding:11px 13px;margin-bottom:12px;display:flex;gap:9px;text-align:left}
.live-dot{width:9px;height:9px;border-radius:50%;background:#1A56DB;
  animation:pulse .9s infinite;flex-shrink:0;margin-top:3px}
.what-next{background:white;border:1px solid #E5E7EB;border-radius:14px;
  padding:13px;margin-bottom:14px;text-align:left}
.wn-title{font-size:13px;font-weight:700;color:#111827;margin-bottom:9px}
.wn-row{display:flex;gap:8px;font-size:12px;color:#374151;font-weight:500;
  line-height:1.5;margin-bottom:5px}
.wn-row:last-child{margin:0}
.wn-arr{color:#1A56DB;font-weight:700;flex-shrink:0}

/* ACTION BAR */
.action-bar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);
  width:100%;max-width:390px;background:white;border-top:1px solid #E5E7EB;
  padding:10px 14px 22px;z-index:100;box-shadow:0 -4px 20px rgba(0,0,0,.07)}
.ab-hint{font-size:11px;color:#9CA3AF;font-weight:500;text-align:center;margin-bottom:8px}
.ab-row{display:flex;gap:8px}
.ab-back{padding:13px 18px;border-radius:12px;background:#F9FAFB;border:1px solid #E5E7EB;
  font-family:'Inter',sans-serif;font-size:14px;font-weight:700;color:#374151;cursor:pointer}
.ab-next{flex:1;padding:13px;border-radius:12px;background:#1A56DB;border:none;
  font-family:'Inter',sans-serif;font-size:14px;font-weight:700;color:white;cursor:pointer}
.ab-next:disabled{background:#BFDBFE;color:#93C5FD;cursor:not-allowed}
.ab-submit{flex:1;padding:13px;border-radius:12px;background:#059669;border:none;
  font-family:'Inter',sans-serif;font-size:14px;font-weight:700;color:white;cursor:pointer}
.btn-p{width:100%;padding:14px;border-radius:12px;background:#1A56DB;border:none;
  font-family:'Inter',sans-serif;font-size:14px;font-weight:700;color:white;cursor:pointer;margin-bottom:8px}
.btn-s{width:100%;padding:13px;border-radius:12px;background:#F9FAFB;border:1px solid #E5E7EB;
  font-family:'Inter',sans-serif;font-size:13px;font-weight:700;color:#374151;cursor:pointer}

/* TOAST */
.toast{position:fixed;top:52px;left:50%;transform:translateX(-50%) translateY(-6px);
  padding:10px 18px;border-radius:24px;font-size:13px;font-weight:700;opacity:0;
  transition:all .3s;pointer-events:none;z-index:9999;white-space:nowrap;
  background:#111827;color:white;box-shadow:0 4px 16px rgba(0,0,0,.18)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.g{background:#059669}.toast.r{background:#EF4444}.toast.b{background:#1A56DB}

/* BOTTOM NAV */
.bottom-nav{position:sticky;bottom:0;background:white;border-top:1px solid #E5E7EB;
  display:flex;padding:8px 4px 12px;box-shadow:0 -4px 20px rgba(0,0,0,.08);flex-shrink:0;z-index:90}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:6px;border-radius:12px;cursor:pointer;transition:background .15s}
.nav-item.active{background:#EFF6FF}
.ni-icon{font-size:21px;color:#9CA3AF}
.ni-label{font-size:9px;font-weight:700;color:#9CA3AF;font-family:'Inter',sans-serif}
.nav-item.active .ni-icon,.nav-item.active .ni-label{color:#1A56DB}
</style>
</head>

// ═══════════════════════════════════════════
// DOLSAFE SMARTREPORT v2 — AI-POWERED ENGINE
// ═══════════════════════════════════════════

var step = 0;
var STEPS = ['Capture','DolSafe Report','Category','Review'];

// REPORT STATE
var R = {
  category: null,
  media: [],          // [{type:'video'|'photo', emoji, dur, label}]
  recording: false,
  recSec: 0,
  severity: null,
  userComment: '',
  // AI-generated fields (editable)
  ai: {
    what:     {text:'', edited:false, editing:false},
    who:      {text:'', edited:false, editing:false},
    where:    {text:'', edited:false, editing:false},
    timeline: {text:'', edited:false, editing:false},
    risk:     {text:'', edited:false, editing:false},
  },
  aiConfidence: 0,
  submitted: false,
  reportId: null,
};

var recIv = null;
var vfIv = null;

// AI REPORT TEMPLATES — generated from captured media
var AI_REPORTS = [
  {
    what:     'Unattended black backpack placed under bench near the north platform entrance. Subject placed the item and walked quickly toward the uptown exit without looking back. Item has been stationary for over 3 minutes.',
    who:      'Male subject, approximately 5\'10", dark hoodie, grey jogger pants, red cap. No visible luggage after placing the item. Walking pace increased notably after placement.',

function initVFCanvas(){
  var c=document.getElementById('vfCanvas'); if(!c) return;
  c.width=c.offsetWidth||360; c.height=c.offsetHeight||260;
  if(vfIv){clearInterval(vfIv); vfIv=null;}
  var t=0;
  vfIv=setInterval(function(){
    t+=0.03; if(!c.isConnected){clearInterval(vfIv);vfIv=null;return;}
    var ctx=c.getContext('2d'),W=c.width,H=c.height;
    ctx.fillStyle='#0D1B2E'; ctx.fillRect(0,0,W,H);
    // Street scene
    ctx.fillStyle='#162032'; ctx.fillRect(0,H*.58,W,H*.42);
    [[.02,.06,.2,.54],[.24,.04,.22,.58],[.5,.08,.24,.54],[.77,.05,.18,.56]].forEach(function(b){
      ctx.fillStyle='#1A2840'; ctx.fillRect(b[0]*W,b[1]*H,b[2]*W,b[3]*H);
      // Windows
      for(var wy=b[1]*H+8;wy<(b[1]+b[3])*H-10;wy+=16){
        for(var wx=b[0]*W+5;wx<(b[0]+b[2])*W-5;wx+=12){
          if(Math.random()>.5){ ctx.fillStyle='rgba(255,220,100,.4)'; ctx.fillRect(wx,wy,6,5); }
        }
      }
    });
    // Crowd
    var people=[{x:.2,s:1},{x:.45,s:-1},{x:.55,s:1},{x:.35,s:-1},{x:.65,s:1}];
    people.forEach(function(p,i){
      var px=(p.x*W+(Math.sin(t*1.2+i)*8*p.s))%W;
      ctx.fillStyle='rgba(200,215,255,.85)';
      ctx.fillRect(px-4,H*.54,8,18);
      ctx.beginPath(); ctx.arc(px,H*.53,4,0,Math.PI*2); ctx.fill();
    });
    // Recording indicator scanline
    if(R.recording){
      ctx.strokeStyle='rgba(239,68,68,.2)'; ctx.lineWidth=1;
      var sy=((t*80)%H); ctx.beginPath(); ctx.moveTo(0,sy); ctx.lineTo(W,sy); ctx.stroke();
    }
    // Timestamp
    ctx.fillStyle='rgba(255,255,255,.3)'; ctx.font='8px monospace';
    ctx.fillText(new Date().toISOString().slice(11,23)+' UTC',5,H-5);
  },60);
}

];

function getCat(id){
  return CATS.find(function(c){return c.id===id;})||{icon:'📋',name:'Unknown',color:'#374151',bg:'#F9FAFB',border:'#E5E7EB'};
}

function aiPickCategory(){
  if(R.category) return;
  var risk=(R.ai.risk.text||'').toLowerCase();
  var what=(R.ai.what.text||'').toLowerCase();
  var all=risk+' '+what;
  if(all.indexOf('package')>=0||all.indexOf('unattended')>=0) R.category='package';
  else if(all.indexOf('weapon')>=0||all.indexOf('firearm')>=0||all.indexOf('gun')>=0||all.indexOf('knife')>=0) R.category='weapon';
  else if(all.indexOf('altercation')>=0||all.indexOf('fight')>=0||all.indexOf('physical')>=0) R.category='fight';
  else if(all.indexOf('harassment')>=0||all.indexOf('stalking')>=0||all.indexOf('threatening')>=0) R.category='harassment';
  else if(all.indexOf('vandal')>=0||all.indexOf('graffiti')>=0||all.indexOf('damage')>=0) R.category='vandalism';
  else if(all.indexOf('medical')>=0||all.indexOf('injury')>=0||all.indexOf('person down')>=0) R.category='medical';
  else if(all.indexOf('vehicle')>=0||all.indexOf('car')>=0) R.category='vehicle';
  else if(all.indexOf('surveillance')>=0||all.indexOf('reconnais')>=0||all.indexOf('photograph')>=0) R.category='suspicious';
  else R.category='suspicious';
}

          'font-size:9px;font-weight:900;color:white">'+(sel?'✓':'')+'</div>'+
      '</div>'+
      '<div style="font-size:12px;font-weight:700;color:'+(sel?c.color:'#111827')+';margin-bottom:2px;line-height:1.3">'+c.name+'</div>'+
    '</div>';
  }).join('');

  var html='<div class="step-body">'+
    '<div class="step-h">Type of incident</div>'+
    '<div class="step-d">DolSafe suggested a category based on your footage. Confirm or change — this routes the report to the right TrustLens analysts.</div>'+

    // AI suggestion chip — prominent
    '<div style="background:'+(selected.bg||'#EFF6FF')+';border:1.5px solid '+(selected.border||'#BFDBFE')+';'+
      'border-radius:12px;padding:11px 13px;margin-bottom:16px;display:flex;align-items:center;gap:10px">'+
      '<div style="font-size:24px;flex-shrink:0">'+selected.icon+'</div>'+
      '<div style="flex:1">'+
        '<div style="font-size:11px;font-weight:600;color:#6B7280;margin-bottom:2px">🤖 DolSafe detected</div>'+
        '<div style="font-size:16px;font-weight:800;color:'+(selected.color||'#111827')+'">'+selected.name+'</div>'+
      '</div>'+
      '<div style="font-size:11px;font-weight:600;color:#9CA3AF">Change below ↓</div>'+
    '</div>'+

    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:16px">'+
      catsHTML+
    '</div>'+

    // Urgency strip
    '<div style="font-size:13px;font-weight:700;color:#374151;margin-bottom:8px">Urgency level</div>'+
    '<div style="display:flex;gap:7px;margin-bottom:4px">'+
    [{id:'low',icon:'🟢',label:'Low',desc:'Not urgent',c:'#065F46',bc:'#10B981',bg:'#F0FDF4'},
     {id:'medium',icon:'🟡',label:'Medium',desc:'Concerning',c:'#92400E',bc:'#F59E0B',bg:'#FFFBEB'},
     {id:'high',icon:'🔴',label:'High',desc:'Urgent now',c:'#991B1B',bc:'#EF4444',bg:'#FEF2F2'},
    ].map(function(s){
      var sel=R.severity===s.id;
      return '<div onclick="R.severity=\''+s.id+'\';render()" style="'+
        'flex:1;padding:10px 6px;border-radius:10px;text-align:center;cursor:pointer;transition:all .15s;'+
        'border:2px solid '+(sel?s.bc:'#E5E7EB')+';background:'+(sel?s.bg:'white')+'">'+
        '<div style="font-size:18px;margin-bottom:3px">'+s.icon+'</div>'+
        '<div style="font-size:11px;font-weight:700;color:'+(sel?s.c:'#374151')+'">'+s.label+'</div>'+
        '<div style="font-size:10px;color:'+(sel?s.c:'#9CA3AF')+';font-weight:500">'+s.desc+'</div>'+
      '</div>';
    }).join('')+
    '</div>'+
  '</div>';

  document.getElementById('stepContent').innerHTML=html;
  setBar(null,
    {label:'← Back'},
    {label:'Continue to review →', disabled:!R.category}
  );
}

// ═══════════════════════════════════════════
// STEP 3 — REVIEW
// ═══════════════════════════════════════════
function renderReview(){
  var ta=document.getElementById('commentTa');
  if(ta) R.userComment=ta.value;

  var sevLabel={low:'🟢 Low — not urgent',medium:'🟡 Medium — concerning',high:'🔴 High — happening now'};
  var editedCount=Object.values(R.ai).filter(function(f){return f.edited;}).length;
  var photoCount=R.media.filter(function(m){return m.type==='photo';}).length;
  var videoCount=R.media.filter(function(m){return m.type==='video';}).length;

  var html='<div class="step-body">'+
    '<div class="step-h">Review before submitting</div>'+
    '<div class="step-d">Final check. '+(editedCount>0?editedCount+' field'+(editedCount>1?'s':'')+' corrected by you. ':'DolSafe wrote all fields. ')+' Submit when ready.</div>'+

    '<div class="review-box">'+
      rv('🏷️','Category',
        (function(){var c=getCat(R.category);return '<span style="display:inline-flex;align-items:center;gap:5px;background:'+c.bg+';color:'+c.color+';border:1px solid '+c.border+';padding:3px 10px;border-radius:20px;font-size:12px;font-weight:700">'+c.icon+' '+c.name+'</span>';})())+
      rv('📹','Media',
        (videoCount?videoCount+' video'+(videoCount>1?'s':''):'')+(videoCount&&photoCount?' · ':'')+(photoCount?photoCount+' photo'+(photoCount>1?'s':''):'')||'No media')+
      rv('⚡','Urgency',sevLabel[R.severity]||'Not set')+
      rv('📋','What happened',R.ai.what.text.slice(0,80)+'…'+(R.ai.what.edited?' ✏️':''))+
      rv('👤','Subject',R.ai.who.text.slice(0,70)+'…'+(R.ai.who.edited?' ✏️':''))+
      rv('📍','Location',R.ai.where.text.slice(0,60)+(R.ai.where.edited?' ✏️':''))+
      rv('⚡','Risk',R.ai.risk.text.slice(0,60)+'…'+(R.ai.risk.edited?' ✏️':''))+
      (R.userComment?rv('✏️','Your comment',R.userComment.slice(0,80)+(R.userComment.length>80?'…':'')):'')+
      rv('🤖','DolSafe confidence',R.aiConfidence+'% · '+Object.values(R.ai).filter(function(f){return f.edited;}).length+' field'+(editedCount!==1?'s':'')+' corrected by reporter')+
    '</div>'+

    '<div class="tl-card">'+
      '<div class="tl-icon">🐬</div>'+
      '<div>'+
        '<div class="tl-title">Feeds TrustLens community intelligence</div>'+
        '<div class="tl-desc">DolSafe summary + your corrections + footage metadata enter the anonymous signal pool. Zero personal data attached.</div>'+
      '</div>'+
    '</div>'+

    '<div class="anon-box">'+
      '<div class="anon-title">✅ Fully anonymous submission</div>'+
      ['No name, account, or device ID attached',
       'EXIF and location metadata stripped from all footage',
       'GPS location rounded to nearest 100 meters',
       'End-to-end encrypted · C2PA integrity certificate attached',
       'Auto-deleted after 72 hours',
      ].map(function(r){
        return '<div class="anon-row"><span style="color:#10B981;font-weight:800">✓</span>'+r+'</div>';
      }).join('')+
    '</div>'+
  '</div>';

  document.getElementById('stepContent').innerHTML=html;
  setBar(null,
    {label:'← Back & edit'},
    null,
    {label:'🐬 Submit anonymously', fn:'submitReport()'}
  );
}

function rv(icon,label,val){
  return '<div class="rv">'+
    '<div class="rv-icon">'+icon+'</div>'+
    '<div style="flex:1">'+
      '<div class="rv-lbl">'+label+'</div>'+
      '<div class="rv-val">'+val+'</div>'+
    '</div>'+
  '</div>';
}

// ═══════════════════════════════════════════
// STEP 3 — CONFIRM (unused - goes to submit)
// ═══════════════════════════════════════════
function renderConfirm(){ submitReport(); }

// ── SUBMIT ──
function submitReport(){
  R.submitted=true;
  R.reportId='SR-'+Date.now().toString(36).toUpperCase().slice(-8);
  renderProg();
  renderSuccess();
}

function renderSuccess(){
  var pb=document.getElementById('progBars');
  if(pb) pb.innerHTML=STEPS.map(function(){return '<div class="pb done"></div>';}).join('');
  var pl=document.getElementById('progLbl'); if(pl) pl.textContent='Submitted ✓';
  var hs=document.getElementById('hdrSub'); if(hs) hs.textContent='Submitted anonymously · '+new Date().toLocaleTimeString();

  var editedCount=Object.values(R.ai).filter(function(f){return f.edited;}).length;

  var html='<div class="success">'+
    '<div class="suc-icon">✅</div>'+
    '<div class="suc-title">Report submitted</div>'+
    '<div style="display:inline-flex;align-items:center;gap:6px;padding:5px 14px;border-radius:20px;'+
      'background:'+(getCat(R.category).bg||'#EFF6FF')+';color:'+(getCat(R.category).color||'#1E40AF')+';'+
      'border:1px solid '+(getCat(R.category).border||'#BFDBFE')+';font-size:13px;font-weight:700;margin-bottom:12px">'+
      getCat(R.category).icon+' '+getCat(R.category).name+
    '</div>'+
    '<div class="suc-sub">Your anonymous DolSafe report is live in TrustLens.'+
      (editedCount?' You corrected '+editedCount+' field'+(editedCount>1?'s':'')+' — your corrections are preserved in the report.':'')+
    '</div>'+

    '<div class="report-id-box">'+
      'Report ID: <span>'+R.reportId+'</span><br>'+
      '<span style="font-size:10px;color:#9CA3AF;font-weight:400">Save to track status · fully anonymous</span>'+
    '</div>'+

    '<div class="tl-live">'+
      '<div class="live-dot"></div>'+
      '<div style="font-size:12px;font-weight:600;color:#1E40AF;line-height:1.55">'+
        'Live in TrustLens. If your report corroborates camera or RF signals in this zone, '+
        'the area safety score updates and analysts are alerted automatically.'+
      '</div>'+
    '</div>'+

    '<div class="what-next">'+
      '<div class="wn-title">What happens next</div>'+
      ['DolSafe summary + corrections enter the anonymous signal pool for this zone',
       'Corroborated by camera behavior or RF patterns → confidence rises',
       'Analysts see aggregated intelligence — never your individual report',
       'HIGH urgency + multiple corroborating signals may surface a security alert',
       'Report auto-deleted after 72h per standard retention',
      ].map(function(s){
        return '<div class="wn-row"><span class="wn-arr">›</span>'+s+'</div>';
      }).join('')+
    '</div>'+

    '<button class="btn-p" onclick="newReport()">+ Submit another report</button>'+
    '<button class="btn-s" onclick="goHome()">← Back to DolSafe home</button>'+
  '</div>';

  document.getElementById('stepContent').innerHTML=html;
  document.getElementById('actionBar').innerHTML='';
}

// ── ACTION BAR ──
function setBar(hint, back, next, submit){
  var h='<div class="action-bar">';
  if(hint) h+=hint;
  h+='<div class="ab-row">';
  if(back) h+='<button class="ab-back" onclick="prev()">'+back.label+'</button>';
  if(next) h+='<button class="ab-next" onclick="nextStep()"'+(next.disabled?' disabled':'')+'>'+next.label+'</button>';
  if(submit) h+='<button class="ab-submit" onclick="'+submit.fn+'">'+submit.label+'</button>';
  h+='</div></div>';
  document.getElementById('actionBar').innerHTML=h;
}

// ── NAV ──
function nextStep(){
  var ta=document.getElementById('commentTa'); if(ta) R.userComment=ta.value;
  if(step===0 && R.media.length===0){ toast('Add at least one video or photo to continue'); return; }
  if(step<STEPS.length-1){ step++; render(); }
}
function prev(){
  if(step>0){ step--; render(); }
  else goBack();
}
function goBack(){ toast('← Returning to DolSafe home'); }
function goHome(){ window.location.reload(); }
function newReport(){
  R={category:null,media:[],recording:false,recSec:0,severity:null,userComment:'',
    ai:{what:{text:'',edited:false,editing:false},who:{text:'',edited:false,editing:false},
        where:{text:'',edited:false,editing:false},timeline:{text:'',edited:false,editing:false},
        risk:{text:'',edited:false,editing:false}},
    aiConfidence:0,submitted:false,reportId:null};
  step=0; render();
}

// ── TOAST ──
function toast(msg,type){
  var t=document.getElementById('toastEl');
  t.textContent=msg; t.className='toast show'+(type?' '+type:'');
  clearTimeout(t._t); t._t=setTimeout(function(){t.classList.remove('show');},3000);
}

// ── BOOT ──
window.addEventListener('load',function(){ render(); });
</script>
</body>
</html>
