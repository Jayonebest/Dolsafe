<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0">
<title>DolSafe · Morning Briefing</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#E8ECF2;font-family:'Inter',sans-serif;color:#111827}
.phone{width:100%;max-width:390px;min-height:100vh;background:#F2F5FA;
  display:flex;flex-direction:column;margin:0 auto;box-shadow:0 0 40px rgba(0,0,0,.12)}

/* STATUS */
.status{height:44px;background:#1A56DB;display:flex;align-items:center;
  justify-content:space-between;padding:0 20px;flex-shrink:0}
.st-time{font-size:15px;font-weight:700;color:white}
.st-r{font-size:11px;color:rgba(255,255,255,.85)}

/* HEADER */
.hdr{background:#1A56DB;padding:10px 16px 16px}
.hdr-row{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.back-btn{width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,.18);
  border:none;color:white;font-size:20px;cursor:pointer;display:flex;
  align-items:center;justify-content:center;flex-shrink:0;font-weight:700}
.hdr-title{font-size:17px;font-weight:800;color:white;flex:1;letter-spacing:-.3px}
.refresh-btn{padding:7px 12px;border-radius:10px;background:rgba(255,255,255,.18);
  border:1px solid rgba(255,255,255,.28);color:white;font-size:12px;font-weight:700;
  cursor:pointer;display:flex;align-items:center;gap:6px;font-family:'Inter',sans-serif;
  transition:all .15s;flex-shrink:0}
.refresh-btn:active{background:rgba(255,255,255,.28)}
.refresh-btn:disabled{opacity:.5;cursor:not-allowed}
.refresh-icon{font-size:14px;transition:transform .6s}
.refresh-icon.spinning{animation:spin .6s linear infinite}

/* ROUTE STRIP */
.route-strip{background:rgba(255,255,255,.14);border-radius:12px;padding:10px 13px;
  display:flex;align-items:center;gap:8px}
.route-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.route-name{font-size:12px;font-weight:600;color:white}
.route-arr{font-size:13px;color:rgba(255,255,255,.6);margin:0 4px}
.route-time{font-size:11px;color:rgba(255,255,255,.7);font-weight:500;margin-left:auto}

/* SCROLL */
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;padding-bottom:20px}
.scroll::-webkit-scrollbar{display:none}

@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
@keyframes scoreGrow{from{width:0}to{width:var(--target-w)}}
@keyframes countUp{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:scale(1)}}

/* GENERATED TIMESTAMP */
.gen-bar{background:#EFF6FF;border-bottom:1px solid #DBEAFE;padding:8px 16px;
  display:flex;align-items:center;justify-content:space-between}
.gen-ai{display:flex;align-items:center;gap:6px;font-size:11px;color:#1D4ED8;font-weight:600}
.gen-dot{width:7px;height:7px;border-radius:50%;background:#1A56DB;animation:pulse .9s infinite}
.gen-time{font-size:10px;color:#93C5FD;font-weight:500}

/* SCORE CARD */
.score-card{margin:12px 14px;background:white;border-radius:18px;overflow:hidden;
  box-shadow:0 4px 20px rgba(0,0,0,.1);animation:fadeUp .4s ease}
.sc-gradient{height:6px}
.sc-body{padding:16px}
.sc-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:12px}
.sc-label{font-size:11px;font-weight:700;color:#6B7280;text-transform:uppercase;
  letter-spacing:1px;margin-bottom:4px}
.sc-num{font-size:56px;font-weight:900;line-height:1;letter-spacing:-2px;animation:countUp .5s ease}
.sc-desc{font-size:13px;font-weight:700;margin-top:2px}
.sc-bar-track{height:8px;background:#F3F4F6;border-radius:4px;overflow:hidden;margin-bottom:10px}
.sc-bar-fill{height:100%;border-radius:4px;animation:scoreGrow .8s ease forwards}
.sc-pills{display:flex;gap:7px;flex-wrap:wrap}
.sc-pill{font-size:11px;font-weight:600;padding:5px 11px;border-radius:20px}

/* SECTION */
.sec{padding:14px 14px 8px;display:flex;align-items:center;justify-content:space-between}
.sec-title{font-size:15px;font-weight:800;color:#111827}
.sec-sub{font-size:11px;color:#6B7280;font-weight:500}

/* AI SUMMARY */
.ai-summary-card{margin:0 14px 10px;background:white;border-radius:16px;
  overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,.07)}
.ais-hdr{background:#EFF6FF;padding:10px 14px;border-bottom:1px solid #DBEAFE;
  display:flex;align-items:center;gap:7px}
.ais-ai-dot{width:8px;height:8px;border-radius:50%;background:#1A56DB;animation:pulse .9s infinite}
.ais-title{font-size:12px;font-weight:700;color:#1E40AF;flex:1}
.ais-model{font-size:10px;color:#93C5FD;font-weight:600}
.ais-body{padding:13px 14px}
.ais-text{font-size:14px;color:#1F2937;line-height:1.7;font-weight:500}

/* ALERTS */
.alerts-wrap{padding:0 14px;display:flex;flex-direction:column;gap:7px;margin-bottom:10px}
.alert-card{background:white;border-radius:14px;padding:12px 13px;
  box-shadow:0 1px 6px rgba(0,0,0,.07);border-left:4px solid;
  display:flex;gap:10px;animation:fadeUp .4s ease}
.al-icon{font-size:20px;flex-shrink:0;margin-top:1px}
.al-body{flex:1}
.al-title{font-size:12px;font-weight:700;color:#111827;margin-bottom:2px}
.al-meta{font-size:11px;color:#6B7280;font-weight:500;line-height:1.4}
.al-tags{display:flex;gap:5px;margin-top:5px;flex-wrap:wrap}
.al-tag{font-size:9px;font-weight:700;padding:2px 7px;border-radius:6px}
.al-right{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0}
.al-dist{font-size:11px;font-weight:700}
.al-time{font-size:10px;color:#9CA3AF;font-weight:500}

/* TRANSIT */
.transit-card{margin:0 14px 10px;background:white;border-radius:16px;
  overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,.07)}
.transit-hdr{background:#F9FAFB;padding:10px 14px;border-bottom:1px solid #E5E7EB;
  display:flex;align-items:center;gap:8px}
.transit-icon{font-size:15px}
.transit-title{font-size:12px;font-weight:700;color:#374151;flex:1}
.transit-status{font-size:10px;font-weight:700;padding:2px 8px;border-radius:8px}
.transit-items{padding:10px 14px;display:flex;flex-direction:column;gap:0}
.transit-item{display:flex;align-items:center;gap:10px;padding:9px 0;
  border-bottom:1px solid #F3F4F6}
.transit-item:last-child{border:none}
.line-badge{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;
  justify-content:center;font-size:12px;font-weight:900;color:white;flex-shrink:0}
.ti-info{flex:1}
.ti-route{font-size:12px;font-weight:700;color:#111827}
.ti-status{font-size:11px;font-weight:500;margin-top:1px}
.ti-badge{font-size:9px;font-weight:700;padding:2px 8px;border-radius:20px;margin-left:auto;flex-shrink:0}

/* WEATHER */
.weather-card{margin:0 14px 10px;background:white;border-radius:16px;
  overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,.07)}
.weather-hdr{background:linear-gradient(135deg,#EFF6FF,#DBEAFE);padding:14px;
  display:flex;align-items:center;gap:12px;border-bottom:1px solid #BFDBFE}
.wx-icon{font-size:36px;flex-shrink:0}
.wx-main{flex:1}
.wx-temp{font-size:28px;font-weight:900;color:#1E40AF;letter-spacing:-.5px}
.wx-desc{font-size:13px;font-weight:600;color:#3B82F6;margin-top:1px}
.wx-impact{font-size:11px;font-weight:600;padding:4px 10px;border-radius:8px;margin-left:auto;flex-shrink:0}
.weather-details{padding:10px 14px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.wd-item{background:#F9FAFB;border-radius:10px;padding:9px 11px}
.wd-lbl{font-size:10px;color:#9CA3AF;font-weight:600;margin-bottom:3px}
.wd-val{font-size:13px;font-weight:700;color:#111827}
.wx-note{padding:0 14px 12px;font-size:12px;color:#374151;font-weight:500;line-height:1.55}

/* ROUTE CARD */
.route-card{margin:0 14px 10px;background:white;border-radius:16px;
  overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,.07)}
.route-hdr{background:#F0FDF4;padding:11px 14px;border-bottom:1px solid #BBF7D0;
  display:flex;align-items:center;gap:8px}
.rh-icon{font-size:15px}
.rh-title{font-size:12px;font-weight:700;color:#065F46;flex:1}
.rh-badge{font-size:9px;font-weight:700;padding:2px 8px;border-radius:8px;
  background:#D1FAE5;color:#065F46}
.route-steps{padding:10px 14px;display:flex;flex-direction:column;gap:0}
.rs-item{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid #F3F4F6;
  align-items:flex-start}
.rs-item:last-child{border:none}
.rs-icon-wrap{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;
  justify-content:center;font-size:15px;flex-shrink:0}
.rs-info{flex:1}
.rs-title{font-size:12px;font-weight:700;color:#111827;margin-bottom:2px}
.rs-detail{font-size:11px;color:#6B7280;font-weight:500}
.rs-time{font-size:11px;font-weight:700;color:#374151;flex-shrink:0;margin-top:1px}
.route-summary{background:#F0FDF4;border-top:1px solid #D1FAE5;padding:10px 14px;
  display:flex;align-items:center;gap:12px}
.rs-total{flex:1;font-size:12px;font-weight:700;color:#065F46}
.rs-save{font-size:11px;color:#10B981;font-weight:600}

/* SKELETON */
.skeleton-card{margin:0 14px 10px;background:white;border-radius:16px;
  overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,.07);padding:16px}
.skel{height:13px;border-radius:6px;background:linear-gradient(90deg,#F3F4F6 25%,#E5E7EB 50%,#F3F4F6 75%);
  background-size:200% 100%;animation:shimmer 1.4s infinite;margin-bottom:8px}
.skel.w-full{width:100%}.skel.w-3q{width:75%}.skel.w-half{width:52%}.skel.w-1q{width:28%}
.skel.tall{height:18px}.skel.sm{height:9px}

/* SHARE + SAVE */
.action-row{padding:8px 14px 4px;display:flex;gap:8px}
.action-btn{flex:1;padding:12px;border-radius:12px;border:none;font-family:'Inter',sans-serif;
  font-size:13px;font-weight:700;cursor:pointer;display:flex;align-items:center;
  justify-content:center;gap:6px;transition:all .15s}
.action-btn:active{transform:scale(.97)}
.ab-share{background:#EFF6FF;color:#1E40AF;border:1px solid #BFDBFE}
.ab-save{background:#F0FDF4;color:#065F46;border:1px solid #BBF7D0}

/* TOAST */
.toast{position:fixed;top:52px;left:50%;transform:translateX(-50%) translateY(-6px);
  padding:10px 18px;border-radius:24px;font-size:13px;font-weight:700;opacity:0;
  transition:all .3s;pointer-events:none;z-index:9999;white-space:nowrap;
  background:#111827;color:white;box-shadow:0 4px 16px rgba(0,0,0,.18)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.g{background:#059669}

/* BOTTOM NAV */
.bottom-nav{position:sticky;bottom:0;background:white;border-top:1px solid #E5E7EB;
  display:flex;padding:8px 4px 12px;box-shadow:0 -4px 20px rgba(0,0,0,.08);flex-shrink:0;z-index:90}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:6px;border-radius:12px;cursor:pointer;transition:background .15s}
.nav-item.active{background:#EFF6FF}
.ni-icon{font-size:21px;color:#9CA3AF}
.ni-label{font-size:9px;font-weight:700;color:#9CA3AF;font-family:'Inter',sans-serif}
.nav-item.active .ni-icon,.nav-item.active .ni-label{color:#1A56DB}
</style>
</head>
<body>
<div class="phone">

  <div class="status">
    <div class="st-time" id="stTime">9:41</div>
    <div class="st-r">📶 WiFi 🔋</div>
  </div>

  <div class="hdr">
    <div class="hdr-row">
      <button class="back-btn" onclick="window.location.href='dolsafe-home.html'">‹</button>
      <div class="hdr-title">DolSafe Briefing</div>
      <button class="refresh-btn" id="refreshBtn" onclick="generateBriefing()">
        <span class="refresh-icon" id="refreshIcon">↻</span>
        Refresh
      </button>
    </div>
    <div class="route-strip">
      <div class="route-dot" style="background:#4ADE80"></div>
      <div class="route-name">Flatbush Ave, Brooklyn</div>
      <div class="route-arr">→</div>
      <div class="route-dot" style="background:#60A5FA"></div>
      <div class="route-name">Midtown Manhattan</div>
      <div class="route-time" id="routeTime">~42 min</div>
    </div>
  </div>

  <div class="scroll" id="scrollEl">
    <div id="mainContent">
      <!-- Content rendered here -->
    </div>
  </div>


  <div class="bottom-nav">
<div class="nav-item" onclick="window.location.href='dolsafe-home.html'"><div class="ni-icon">🏠</div><div class="ni-label">Home</div></div><div class="nav-item active"><div class="ni-icon" style="color:#1A56DB">🧠</div><div class="ni-label" style="color:#1A56DB">Briefing</div></div><div class="nav-item" onclick="window.location.href='dolsafe-smartreport.html'"><div class="ni-icon">📋</div><div class="ni-label">Report</div></div><div class="nav-item" onclick="window.location.href='dolsafe-sos.html'"><div class="ni-icon">🆘</div><div class="ni-label">SOS</div></div><div class="nav-item" onclick="window.location.href='dolsafe-car.html'"><div class="ni-icon">🚗</div><div class="ni-label">My Car</div></div>
  </div>

</div>

<div class="toast" id="toastEl"></div>

<script>
// ═══════════════════════════════════════════
// DOLSAFE MORNING BRIEFING · CLAUDE API
// ═══════════════════════════════════════════

var isLoading = false;
var lastGenTime = null;

// ── CLOCK ──
function tick(){
  var d=new Date(),h=d.getHours()%12||12,m=String(d.getMinutes()).padStart(2,'0');
  var el=document.getElementById('stTime');if(el)el.textContent=h+':'+m;
}
setInterval(tick,1000);tick();

function goBack(){ toast('← Back to DolSafe home'); }

function toast(msg,type){
  var t=document.getElementById('toastEl');
  t.textContent=msg;t.className='toast show'+(type?' '+type:'');
  clearTimeout(t._t);t._t=setTimeout(function(){t.classList.remove('show');},3000);
}

// ── SKELETON LOADING ──
function showSkeleton(){
  document.getElementById('mainContent').innerHTML=
    '<div style="height:6px;background:linear-gradient(90deg,#DBEAFE,#BFDBFE,#DBEAFE);background-size:200% 100%;animation:shimmer 1.4s infinite"></div>'+
    '<div style="background:#EFF6FF;border-bottom:1px solid #DBEAFE;padding:8px 16px;display:flex;align-items:center;gap:7px">'+
      '<div style="width:7px;height:7px;border-radius:50%;background:#1A56DB;animation:pulse .9s infinite"></div>'+
      '<div style="font-size:12px;font-weight:700;color:#1E40AF">DolSafe is preparing your briefing…</div>'+
    '</div>'+

    // Score skeleton
    '<div style="margin:12px 14px 10px;background:white;border-radius:18px;padding:16px;box-shadow:0 4px 20px rgba(0,0,0,.1)">'+
      '<div class="skel tall w-1q" style="margin-bottom:12px"></div>'+
      '<div class="skel w-full" style="height:56px;margin-bottom:12px"></div>'+
      '<div class="skel w-full" style="height:8px;border-radius:4px;margin-bottom:10px"></div>'+
      '<div style="display:flex;gap:8px"><div class="skel w-1q" style="height:28px;border-radius:20px"></div><div class="skel w-1q" style="height:28px;border-radius:20px"></div><div class="skel w-1q" style="height:28px;border-radius:20px"></div></div>'+
    '</div>'+

    // AI summary skeleton
    '<div style="margin:0 14px 10px;background:white;border-radius:16px;overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,.07)">'+
      '<div style="background:#EFF6FF;padding:10px 14px;border-bottom:1px solid #DBEAFE"><div class="skel w-half sm"></div></div>'+
      '<div style="padding:14px"><div class="skel w-full"></div><div class="skel w-3q"></div><div class="skel w-full"></div><div class="skel w-half"></div></div>'+
    '</div>'+

    // Alerts skeleton
    [1,2,3].map(function(){
      return '<div style="margin:0 14px 7px;background:white;border-radius:14px;padding:12px 13px;box-shadow:0 1px 6px rgba(0,0,0,.07);display:flex;gap:10px">'+
        '<div class="skel" style="width:36px;height:36px;border-radius:10px;flex-shrink:0"></div>'+
        '<div style="flex:1"><div class="skel w-3q"></div><div class="skel w-full sm"></div><div class="skel w-half sm"></div></div>'+
      '</div>';
    }).join('');
}

// ── CLAUDE API CALL ──
async function generateBriefing(){
  if(isLoading) return;
  isLoading=true;

  var btn=document.getElementById('refreshBtn');
  var icon=document.getElementById('refreshIcon');
  if(btn) btn.disabled=true;
  if(icon) icon.className='refresh-icon spinning';

  showSkeleton();
  document.getElementById('scrollEl').scrollTop=0;

  var now=new Date();
  var timeStr=(now.getHours()%12||12)+':'+String(now.getMinutes()).padStart(2,'0')+
    ' '+(now.getHours()>=12?'PM':'AM');
  var dayStr=now.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});

  var prompt = `You are the DolSafe safety intelligence engine generating a morning commute briefing.

User: James, commuting from Flatbush Ave, Brooklyn (near B/Q subway) to Midtown Manhattan.
Date: ${dayStr}
Time: ${timeStr}

Generate a comprehensive morning safety briefing in JSON format with these exact fields:

{
  "score": <integer 0-100 overall route safety score>,
  "scoreLabel": <"Very Safe"|"Safe"|"Moderate-Safe"|"Use Caution"|"High Risk">,
  "scoreColor": <"#10B981"|"#22C55E"|"#F59E0B"|"#F97316"|"#EF4444">,
  "summary": <2-3 sentence personalized safety summary for James's commute today, mention specific Brooklyn/Manhattan details>,
  "alerts": [
    {
      "icon": <single emoji>,
      "title": <alert title, max 50 chars>,
      "meta": <location and source, max 60 chars>,
      "tags": [<1-2 short tag strings>],
      "tagColor": <hex color>,
      "tagBg": <light hex bg>,
      "dist": <distance like "0.4mi">,
      "time": <time like "23 min ago">,
      "severity": <"critical"|"warning"|"info">
    }
  ],
  "transit": [
    {
      "line": <"B"|"Q"|"2"|"3"|"A"|"C"|"E"|"N"|"R"|"W">,
      "lineColor": <hex>,
      "route": <route description>,
      "status": <status text>,
      "statusColor": <"#10B981"|"#F59E0B"|"#EF4444">,
      "badge": <badge label>,
      "badgeColor": <"#D1FAE5"|"#FEF3C7"|"#FEE2E2">,
      "badgeText": <"#065F46"|"#92400E"|"#991B1B">
    }
  ],
  "weather": {
    "icon": <weather emoji>,
    "temp": <like "58°F">,
    "desc": <like "Partly cloudy">,
    "wind": <like "12 mph NW">,
    "humidity": <like "64%">,
    "visibility": <like "9 miles">,
    "safetyImpact": <"Low impact"|"Moderate impact"|"High impact">,
    "impactColor": <"#10B981"|"#F59E0B"|"#EF4444">,
    "impactBg": <light bg>,
    "note": <1 sentence safety note about weather for James's walk to subway>
  },
  "route": {
    "steps": [
      {
        "icon": <emoji>,
        "bg": <light color like "#EFF6FF">,
        "title": <step title>,
        "detail": <detail>,
        "time": <like "4 min">
      }
    ],
    "totalTime": <like "38 min">,
    "saving": <like "Saves 8 min vs driving">
  }
}

Respond ONLY with the JSON object. No markdown, no extra text. Make it realistic for NYC/Brooklyn today.`;

  try {
    var response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({
        model: "claude-sonnet-4-20250514",
        max_tokens: 1000,
        messages: [{role:"user", content: prompt}]
      })
    });

    var data = await response.json();
    var text = data.content.map(function(b){return b.text||'';}).join('');
    // Strip any markdown fences
    text = text.replace(/```json|```/g,'').trim();
    var briefing = JSON.parse(text);
    lastGenTime = new Date();
    renderBriefing(briefing);

  } catch(err) {
    console.error('API error:', err);
    renderBriefing(getFallback());
    toast('Using cached briefing — tap refresh to retry');
  } finally {
    isLoading=false;
    var btn2=document.getElementById('refreshBtn');
    var icon2=document.getElementById('refreshIcon');
    if(btn2) btn2.disabled=false;
    if(icon2) icon2.className='refresh-icon';
  }
}

// ── FALLBACK DATA ──
function getFallback(){
  return {
    score:74, scoreLabel:'Moderate-Safe',
    scoreColor:'#F59E0B',
    summary:"Your commute this morning is mostly clear, James. A pickpocket incident overnight near Fulton St station warrants awareness at fare gates on the B/Q. The B train is running with minor delays — allow an extra 5 minutes. Your route through Midtown is safe with normal pedestrian flow.",
    alerts:[
      {icon:'⚠️',title:'Pickpocket alert · B/Q Fulton St',meta:'NYPD Transit · Platform level',tags:['WATCH'],tagColor:'#92400E',tagBg:'#FEF3C7',dist:'1.2mi',time:'47 min ago',severity:'warning'},
      {icon:'📦',title:'Package investigation resolved · Penn Station',meta:'MTA Police · All clear issued',tags:['RESOLVED'],tagColor:'#065F46',tagBg:'#D1FAE5',dist:'3.4mi',time:'2h ago',severity:'info'},
      {icon:'👁️',title:'Suspicious activity · DeKalb Ave platform',meta:'DolSafe community · 3 reports',tags:['ELEVATED'],tagColor:'#92400E',tagBg:'#FFF7ED',dist:'0.8mi',time:'18 min ago',severity:'warning'},

      {line:'B',lineColor:'#F97316',route:'B train · Flatbush → 34th St Herald Sq',status:'Minor delays — 5-8 min',statusColor:'#F59E0B',badge:'DELAYED',badgeColor:'#FEF3C7',badgeText:'#92400E'},
      {line:'Q',lineColor:'#F59E0B',route:'Q train · Flatbush → 57th St',status:'Good service',statusColor:'#10B981',badge:'ON TIME',badgeColor:'#D1FAE5',badgeText:'#065F46'},
      {line:'2',lineColor:'#EF4444',route:'2/3 express · Atlantic Av → Times Sq',status:'Good service',statusColor:'#10B981',badge:'ON TIME',badgeColor:'#D1FAE5',badgeText:'#065F46'},
    ],
    weather:{
      icon:'⛅',temp:'58°F',desc:'Partly cloudy',wind:'11 mph NW',humidity:'62%',
      visibility:'9 miles',safetyImpact:'Low impact',impactColor:'#10B981',
      impactBg:'#D1FAE5',
      note:'Cool and dry conditions. Light jacket recommended for the walk to Flatbush Ave station. No precipitation expected until evening.',
    },
    route:{
      steps:[
        {icon:'🚶',bg:'#F0FDF4',title:'Walk to Flatbush Ave–Brooklyn College station',detail:'7-min walk · B/Q platform',time:'7 min'},
        {icon:'🚇',bg:'#FFF7ED',title:'Take Q train — use rear cars',detail:'Avoid Fulton St platform · exit at 34th St',time:'28 min'},
        {icon:'🚶',bg:'#EFF6FF',title:'Walk to your destination',detail:'34th St Herald Sq → Midtown',time:'5 min'},
      ],
      totalTime:'40 min',saving:'Saves 12 min vs B train today',
    },
  };
}

// ── RENDER ──
function renderBriefing(d){
  var genTimeStr = lastGenTime
    ? lastGenTime.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'})
    : new Date().toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'});

  var scoreW = d.score+'%';
  var gradColors = d.score>=80?'#10B981,#22C55E':d.score>=60?'#F59E0B,#FBB040':d.score>=40?'#F97316,#EA580C':'#EF4444,#DC2626';

  // SCORE CARD
  var scoreHTML =
    '<div class="score-card">'+
      '<div class="sc-gradient" style="background:linear-gradient(90deg,'+gradColors+')"></div>'+
      '<div class="sc-body">'+
        '<div class="sc-top">'+
          '<div>'+
            '<div class="sc-label">DolSafe route score</div>'+
            '<div class="sc-num" style="color:'+d.scoreColor+'">'+d.score+'</div>'+
            '<div class="sc-desc" style="color:'+d.scoreColor+'">'+d.scoreLabel+'</div>'+
          '</div>'+
          '<div style="text-align:right">'+
            '<div style="font-size:11px;color:#9CA3AF;font-weight:500;margin-bottom:6px">Flatbush → Midtown</div>'+
            '<div style="font-size:12px;font-weight:700;color:#374151">'+d.route.totalTime+' total</div>'+
            '<div style="font-size:11px;color:#10B981;font-weight:600;margin-top:2px">'+d.route.saving+'</div>'+
          '</div>'+
        '</div>'+
        '<div class="sc-bar-track">'+
          '<div class="sc-bar-fill" style="--target-w:'+scoreW+';width:'+scoreW+';background:linear-gradient(90deg,'+gradColors+')"></div>'+
        '</div>'+
        '<div class="sc-pills">'+
          '<div class="sc-pill" style="background:'+d.scoreColor+'18;color:'+d.scoreColor+'">'+d.alerts.length+' alerts on route</div>'+
          '<div class="sc-pill" style="background:#EFF6FF;color:#1E40AF">'+d.transit.length+' lines checked</div>'+
          '<div class="sc-pill" style="background:#F0FDF4;color:#065F46">'+d.weather.temp+' · '+d.weather.desc+'</div>'+
        '</div>'+
      '</div>'+
    '</div>';

  // AI SUMMARY
  var summaryHTML =
    '<div class="ai-summary-card">'+
      '<div class="ais-hdr">'+
        '<div class="ais-ai-dot"></div>'+
        '<div class="ais-title">DolSafe Safety Briefing · James</div>'+
        '<div class="ais-model">DolSafe · '+genTimeStr+'</div>'+
      '</div>'+
      '<div class="ais-body">'+
        '<div class="ais-text">'+d.summary+'</div>'+
      '</div>'+
    '</div>';

  // ALERTS
  var alertsHTML = '<div class="sec"><div class="sec-title">🚨 Alerts on your route</div><div class="sec-sub">'+d.alerts.length+' active</div></div>'+
    '<div class="alerts-wrap">'+
    d.alerts.map(function(a){
      var borderColor=a.severity==='critical'?'#EF4444':a.severity==='warning'?'#F59E0B':'#3B82F6';
      return '<div class="alert-card" style="border-left-color:'+borderColor+'">'+
        '<div class="al-icon">'+a.icon+'</div>'+
        '<div class="al-body">'+
          '<div class="al-title">'+a.title+'</div>'+
          '<div class="al-meta">'+a.meta+'</div>'+
          '<div class="al-tags">'+
            a.tags.map(function(t){return '<span class="al-tag" style="background:'+a.tagBg+';color:'+a.tagColor+'">'+t+'</span>';}).join('')+
          '</div>'+
        '</div>'+
        '<div class="al-right">'+
          '<div class="al-time">'+a.time+'</div>'+
          '<div class="al-dist" style="color:'+borderColor+'">'+a.dist+'</div>'+
        '</div>'+
      '</div>';
    }).join('')+
    '</div>';

  // TRANSIT
  var transitHTML =
    '<div class="sec"><div class="sec-title">🚇 MTA service status</div></div>'+
    '<div class="transit-card">'+
      '<div class="transit-hdr">'+
        '<div class="transit-icon">🚉</div>'+
        '<div class="transit-title">Lines on your commute</div>'+
        '<div class="transit-status" style="background:#EFF6FF;color:#1E40AF">Live</div>'+
      '</div>'+
      '<div class="transit-items">'+
      d.transit.map(function(t){
        return '<div class="transit-item">'+
          '<div class="line-badge" style="background:'+t.lineColor+'">'+t.line+'</div>'+
          '<div class="ti-info">'+
            '<div class="ti-route">'+t.route+'</div>'+
            '<div class="ti-status" style="color:'+t.statusColor+'">'+t.status+'</div>'+
          '</div>'+
          '<div class="ti-badge" style="background:'+t.badgeColor+';color:'+t.badgeText+'">'+t.badge+'</div>'+
        '</div>';
      }).join('')+
      '</div>'+
    '</div>';

  // WEATHER
  var weatherHTML =
    '<div class="sec"><div class="sec-title">🌤️ Weather & commute impact</div></div>'+
    '<div class="weather-card">'+
      '<div class="weather-hdr">'+
        '<div class="wx-icon">'+d.weather.icon+'</div>'+
        '<div class="wx-main">'+
          '<div class="wx-temp">'+d.weather.temp+'</div>'+
          '<div class="wx-desc">'+d.weather.desc+'</div>'+
        '</div>'+
        '<div class="wx-impact" style="background:'+d.weather.impactBg+';color:'+d.weather.impactColor+'">'+d.weather.safetyImpact+'</div>'+
      '</div>'+
      '<div class="weather-details">'+
        [['💨 Wind',d.weather.wind],['💧 Humidity',d.weather.humidity],['👁 Visibility',d.weather.visibility],['🌡️ Feels like',d.weather.temp]].map(function(w){
          return '<div class="wd-item"><div class="wd-lbl">'+w[0]+'</div><div class="wd-val">'+w[1]+'</div></div>';
        }).join('')+
      '</div>'+
      '<div class="wx-note">'+d.weather.note+'</div>'+
    '</div>';

  // ROUTE
  var routeHTML =
    '<div class="sec"><div class="sec-title">🗺️ Recommended route</div></div>'+
    '<div class="route-card">'+
      '<div class="route-hdr">'+
        '<div class="rh-icon">✅</div>'+
        '<div class="rh-title">DolSafe-optimized for safety &amp; speed today</div>'+
        '<div class="rh-badge">RECOMMENDED</div>'+
      '</div>'+
      '<div class="route-steps">'+
      d.route.steps.map(function(s){
        return '<div class="rs-item">'+
          '<div class="rs-icon-wrap" style="background:'+s.bg+'">'+s.icon+'</div>'+
          '<div class="rs-info">'+
            '<div class="rs-title">'+s.title+'</div>'+
            '<div class="rs-detail">'+s.detail+'</div>'+
          '</div>'+
          '<div class="rs-time">'+s.time+'</div>'+
        '</div>';
      }).join('')+
      '</div>'+
      '<div class="route-summary">'+
        '<div class="rs-total">Total: '+d.route.totalTime+' · via MTA subway</div>'+
        '<div class="rs-save">'+d.route.saving+'</div>'+
      '</div>'+
    '</div>';

  // ACTIONS
  var actionsHTML =
    '<div class="action-row">'+
      '<button class="action-btn ab-share" onclick="toast(\'📤 Briefing shared\')">📤 Share</button>'+
      '<button class="action-btn ab-save" onclick="toast(\'💾 Saved to your history\',\'g\')">💾 Save</button>'+
    '</div>';

  // GEN BAR
  var genBar =
    '<div class="gen-bar">'+
      '<div class="gen-ai"><div class="gen-dot"></div>Generated by DolSafe Intelligence</div>'+
      '<div class="gen-time">'+genTimeStr+'</div>'+
    '</div>';

  document.getElementById('mainContent').innerHTML =
    genBar + scoreHTML + summaryHTML +
    alertsHTML + transitHTML + weatherHTML + routeHTML + actionsHTML;

  document.getElementById('scrollEl').scrollTop=0;
}

// ── BOOT ──
window.addEventListener('load', function(){
  generateBriefing();
});
</script>
</body>
</html>
